      - paragraph [ref=f1e148]: "And then the period's most uncomfortable find: the credentials file was never staged to devices, so every prior \"PASS\" on the real-network functional tests had been a no-op with a green checkmark. Fixed inside the same sweep that found it, and the fix immediately surfaces real bugs. The period's lesson, learned early: the bench is the only judge whose verdict counts."
