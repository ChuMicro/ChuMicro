      - paragraph [ref=f1e83]: Act I · April 1 to 12 · 499 commits
      - heading "Ignition" [level=2] [ref=f1e85]
      - generic [ref=f1e86]:
        - paragraph [ref=f1e87]: "Day one is 25 commits: a mono-workspace, CI, a test harness, seven written decisions, and a sample library that ends the day renamed to timing, carrying a class called Heartbeat. The first decision record gets superseded 71 minutes after adoption. The pace never really slows from there."
        - paragraph [ref=f1e88]: "The first war is architectural. An event-bus library is born on April 2 and thrashes violently for two days: an unauthorized redesign guts it by a thousand lines, the revert is blunt, and by 00:17 on April 4 the whole event machinery is deleted for the gate-based check/handle model that will govern the fleet forever after."
      - blockquote [ref=f1e89]:
        - generic [ref=f1e90]: bc71f16a · 2026-04-03
        - text: "\"Revert serviceable to event-based architecture\" — This was not the intended change."
      - generic [ref=f1e91]:
        - paragraph [ref=f1e92]: "At 01:18 that night, still up, the session root-causes a broken build to a stale binary with \"a broken import reader, EBADF on any filesystem import.\" Hours later comes the repo's first genuine upstream discovery, four days into its life: CircuitPython 10.1.4 cannot build its own standard unix variant. A missing object file, a fork bug CircuitPython's CI never sees. Documented forensically, worked around with a self-removing flag (Decision 0017)."
        - paragraph [ref=f1e93]:
          - text: "April 5 and 6 are the release gauntlet: five PyPI versions burned as test ammunition, bundle repos recreated after PII exposure, and a release killed by a one-character typo,"
          - code [ref=f1e94]: "dname:"
          - text: ", on line 1 of release.yml. Underneath it all, a stranger thread: the repo learning to manage its own author."
      - generic [ref=f1e95]:
        - generic [ref=f1e96]:
          - heading "Teaching the agents" [level=4] [ref=f1e97]
          - paragraph [ref=f1e98]: "\"Agents read top-down with decreasing attention.\" AGENTS.md is reorganized around that measured claim (e80dbc6e)."
        - generic [ref=f1e99]:
          - heading "Lint beats prose" [level=4] [ref=f1e100]
          - paragraph [ref=f1e101]: The CHU001 linter exists because "agents obey lint rules and ignore prose conventions" (0e317192).
        - generic [ref=f1e102]:
          - heading "A higher bar for the machine" [level=4] [ref=f1e103]
          - paragraph [ref=f1e104]: "Coverage split by author species: humans 85%, agents forced to 94% (Decision 0025)."
        - generic [ref=f1e105]:
          - heading "Measured, not assumed" [level=4] [ref=f1e106]
          - paragraph [ref=f1e107]: Type annotations proven to cost zero bytes on embedded runtimes, ".mpy bytecode is byte-identical," reversing a day-old policy (de997430).
      - paragraph [ref=f1e109]: "April 12: device testing validated on a real Lolin S2. The first test ever run on physical silicon passes in 0.064 seconds."
    - generic [ref=f1e110]:
      - paragraph [ref=f1e111]: Act II · April 17 to 30 · 426 commits
      - heading "Hardware Truth" [level=2] [ref=f1e113]
      - generic [ref=f1e114]:
        - paragraph [ref=f1e115]: "The machinery that talks to boards gets built, and the boards answer back. Firmware flashing strands one Lolin S2 in ROM bootloader, then outright bricks its sibling by writing at flash offset 0x0 instead of 0x1000. Both recover. macOS becomes the quiet antagonist: AppleDouble sidecars, a kernel-locked .Trashes directory defeated by planting .Trashes as a file, and the FSKit wedge with its own exact sudo recovery incantation."
        - paragraph [ref=f1e116]: "Then the big bang. Between April 25 and 27, eight libraries are born in 72 hours. One commit self-reports the run: \"72 commits, +36k/-4.4k LOC\" in two days. mqtt arrives at 00:08 as 4,305 lines in a single commit, closing on a five-minute hardware soak with zero bytes of net heap drift."
