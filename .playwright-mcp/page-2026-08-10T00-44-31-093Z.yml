      - paragraph [ref=f1e266]: "July 16: experimental channel, 18 of 18. July 19: stable closes 19 of 19 on PyPI, the bootstrap token is revoked, and a provenance audit counts zero token uploads. The session transcripts show who did the shipping: the July 18 and 19 grind ran on claude-opus-4-8 with Fable 5 mixed in on the 19th, exactly the topology the GA docs pass had written down: \"Opus agents where the work is bulk or mechanical; Fable where reasoning is needed.\""
    - generic [ref=f1e267]:
      - paragraph [ref=f1e268]: Act VII · August 1 to 9
      - heading "Public" [level=2] [ref=f1e270]
      - generic [ref=f1e271]:
        - paragraph [ref=f1e272]: "August opens with CI red for fourteen straight pushes over 236 excess characters in two decision-record summary lines. The week that follows is a pre-public sweep of the release fabric, run on claude-opus-5 by the transcripts' testimony, and it keeps finding one shape, which a commit names in passing: \"a green job that shipped nothing is the failure this repo keeps meeting.\" The version gate had graded only a push's tip. The docs job went green without pushing. Every mqtt install had been broken on both channels since July 18, invisible to CI, found by installing as a consumer with a faked boot_out.txt."
        - paragraph [ref=f1e273]: "August 9, the repo goes public, and the record shows a sprint: nine PRs merged in one day, main flipped to PR-only for agents as much as humans (Decision 0120), private vulnerability reporting found disabled and switched on, a 196-file design-smell audit answered by the human through the decision picker, \"nine calls landed,\" and the macOS FAT corruption that ate a board's filesystem twice in one day root-caused to a missing F_FULLFSYNC barrier."
        - paragraph [ref=f1e274]: "The first live AI review runs end to end on a real PR: five inline findings, all real, all applied before merge. And the day's model-governance commit is the newest era marker in the whole history:"
      - blockquote [ref=f1e275]:
        - generic [ref=f1e276]: "44b74dd3 · 2026-08-09 · PR #16"
        - text: "\"ai-review: pin the review model to Sonnet tier\" — reviews run on claude-sonnet-5, with claude-opus-5 as the sanctioned step-up, and no Fable/Mythos-class model until the maintainer is satisfied with the mechanism."
      - paragraph [ref=f1e278]: "Read against June, that is not generic caution. Six weeks after a Fable-class model was export-controlled over a jailbreak that made it identify software vulnerabilities, the maintainer declines to wire that exact model class into an auto-triggered lane where strangers' pull requests are the input. The lane's own design notes carry the lesson: \"the PR head is checked out as data and never executed.\" Every session of the public-day sprint itself ran on claude-fable-5. The queue burns from eighteen bullets to one."
