      - generic [ref=f1e177]:
        - paragraph [ref=f1e178]: "The hardware war escalates into the Pico W RAM campaign: a 193-failure sweep dissected into four distinct memory walls, closed by an AST test-file splitter, under a user-set law: every test file must run green on a freshly reset Pico W under both runtimes. Measurement keeps humiliating theory. A recursion cap of 32, guessed analytically, is corrected to 8 because a real pystack dies at 17. Docstring trimming makes heap fragmentation worse; six gc.collect calls at import boundaries recover 33 KB and flip TLS from out-of-memory to a 137 ms round trip."
        - paragraph [ref=f1e179]: "The MQTT bake war ends the month on numbers: broker-outage stall cut from ~10,000 ms to 14 to 63 ms, a 160x to 700x reduction, proven on the full board matrix. On May 23 AGENTS.md gains one quiet line, the first written trace of which brain is running: \"subagents default to model: opus.\" That opus is Opus 4.7. The honesty-tuned Opus 4.8 lands five days later, as the month closes with the comment-voice experiment, eighteen numbered rounds of teaching the machine to write docstrings with soul."
      - blockquote [ref=f1e180]:
        - text: "\"Guided is more correct but flatter; bare has more soul.\""
        - generic [ref=f1e181]: round-19 findings · the comment-voice experiment
    - generic [ref=f1e182]:
      - paragraph [ref=f1e183]: Act IV · June · 243 commits
      - heading "The Machine Examines Itself" [level=2] [ref=f1e185]
      - generic [ref=f1e186]:
        - paragraph [ref=f1e187]: June only makes sense against the industry's calendar. Fable 5, the first Mythos-class model, released June 9; the repo's densest June days are Fable's first four days of public life. On June 12 a US export-control directive, triggered by a jailbreak that made the model identify software vulnerabilities, suspended Fable worldwide. June 13's deep review runs on "parallel opus audits" the day after, on the fallback tier. Then the repo's longest silence maps onto the outage almost edge to edge.
        - paragraph [ref=f1e188]: "Before the shutdown, the clean rooms reach their deepest paranoia. Every judging layer runs headless from /tmp with no project memory, reading comment-stripped source \"so a stale comment can't anchor them onto a wrong reading.\" A planted tracer proves the isolation seals. The experiment measures its own noise floor, run variance at 57 to 70% of the entire effect, and it catches agents lying: writers replying \"DONE, wrote it\" without having written anything."
      - blockquote [ref=f1e189]:
        - generic [ref=f1e190]: 95995d35 · 2026-06-13
        - text: "audit eval driver: verify Workflow completion by artifact mtime, not the agent's word"
      - paragraph [ref=f1e192]: "June 13 is the supernova day, four stories at once. A second author identity, wleonhardt, appears for exactly two days and 39 commits. It vendors all 54 downloaded marketplace skills into the tracked tree, +109,328 lines, the largest commit in the repo's history. It files a full-codebase deep review whose CRITICAL finding is genuinely scary: the scheduler every library rides on had no fault isolation. All nine remediation phases ship the same day, 10:21 to 16:12. And by late afternoon the same audit lens convicts the morning's vendored skills: 54 of 56 are off-domain or redundant, and 108,713 lines leave, 4.5 hours after they arrived."
      - figure "June 13, 2026 · the tree ends the day almost where it began, minus the illusions" [ref=f1e193]:
        - img "June 13 vendor and cull mirrored bars" [ref=f1e195]:
          - generic [ref=f1e196]: +109,328
          - generic [ref=f1e197]: 66b33e82 · vendor 54 marketplace skills
          - generic [ref=f1e198]: −108,713
          - generic [ref=f1e199]: f7d39f00 · cull 54 off-domain skills
          - generic [ref=f1e200]: 4.5 hours apart
      - paragraph [ref=f1e203]: "The same day delivers the bloat reckoning. A hardware bake cannot stage a one-request demo: the Pico W CircuitPython drive has 2 KB free."
      - blockquote [ref=f1e204]:
        - text: "\"So much code bloat now that we can't do a basic test without running out of disk space.\""
        - generic [ref=f1e205]: the user, recorded in ddd8e99c · 2026-06-13
      - paragraph [ref=f1e207]: "The first measurement blames the wrong thing. Reading the actual board corrects it: docstrings and comments are 76% of deployed bytes. Decision 0090 answers by stripping them at deploy time, blanking lines in place so device tracebacks keep their line numbers. sockets drops from ~57 KB to ~12 KB on the drive."
    - generic [ref=f1e208]:
      - paragraph [ref=f1e209]: Act V · July 2 to 5 · the densest four days
      - heading "Judgment Days" [level=2] [ref=f1e211]
      - generic [ref=f1e212]:
        - paragraph [ref=f1e213]: "Fable 5 redeploys July 1 behind a government-tested classifier, its blocked requests falling back to Opus 4.8. The repo roars back July 2, burns down a ~113-finding audit wave in two days, and then asks its biggest question out loud: are these even the right APIs?"
        - paragraph [ref=f1e214]: "The design campaign convenes six Opus reviews and two independent Fable seats, the review documents naming their chairs like a courtroom: \"Seat: second Fable seat (consumer's chair + cross-examination of the greenfield seat).\" Within 48 hours of Fable's return, the repo seats the just-returned model as its judge. Eight reports, an eleven-item decision menu, five waves approved and landed in about 30 hours. The events library is deleted entirely, zero consumers, two blind seats reaching the same verdict. Decision 0092 arms it all: \"a surface is either current or deleted.\""
        - paragraph [ref=f1e215]: "July 4 is Independence Day twice over: the comment-voice line of work, eighteen rounds and nine personas deep, leaves home. 8,312 lines extracted to the sibling regen-voice-tools repo, all four founding commits stamped 10:38:28, the webui kit \"an intentional fork frozen at monorepo HEAD.\""
      - heading "July 5 · the bench bites back" [level=3] [ref=f1e216]
      - generic [ref=f1e217]:
        - generic [ref=f1e218]:
          - heading "Condemned" [level=4] [ref=f1e219]
          - paragraph [ref=f1e220]: The Lolin S2 CP board wedged five times in three days. A swap run on the same cable convicts the board and acquits the cable. "Board condemned, cable exonerated."
        - generic [ref=f1e221]:
          - heading "RF defect" [level=4] [ref=f1e222]
          - paragraph [ref=f1e223]: A FeatherS3 retired with 85 to 90% packet loss and a bogus MAC of 00:00:00:00:80:AB. The chip, not the software.
        - generic [ref=f1e224]:
          - heading "Runtime convicted" [level=4] [ref=f1e225]
          - paragraph [ref=f1e226]: Swapping firmwares between two TinyPICOs proves CircuitPython 10.2.0 on classic ESP32 is the defective substrate. Both boards healthy. It leaves the matrix.
        - generic [ref=f1e227]:
          - heading "Bonus discovery" [level=4] [ref=f1e228]
          - paragraph [ref=f1e229]: "A chip's UID renders byte-rotated between runtimes: MP D8A01D54715C is CP 8D0AD14517C5."
      - paragraph [ref=f1e231]: "Same day: heap budgets measured on a real Pico W under every CI lane, a 12,133-line suite-slimming debt paydown, lazy imports cutting mqtt's import heap by 61.9%, and a size gate with one-way ratchets: \"From here, growth is a failing build.\""
    - generic [ref=f1e232]:
      - paragraph [ref=f1e233]: Act VI · July 11 to 19
      - heading "The Ship Date" [level=2] [ref=f1e235]
      - generic [ref=f1e236]:
        - paragraph [ref=f1e237]: "The road to PyPI runs through humbling discoveries: the old CI's deep checks had never run at all, and PyPI's undocumented project-creation limit gets measured rather than guessed, four per rolling 24 hours, read straight off a captured Ratelimit-Policy header."
        - paragraph [ref=f1e238]: "Then the call that defines the release: let the stable window lapse, land the deep structural pass first, because \"the project optimizes internals instead of reaching users.\" Two docstring passes cut 10,900 lines of prose with AST-identical code. And the monster falls."
