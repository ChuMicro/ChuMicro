    - generic [ref=f1e151]:
      - paragraph [ref=f1e152]: Act III · May · 1,358 commits, the biggest month
      - heading "Full Burn" [level=2] [ref=f1e154]
      - generic [ref=f1e155]:
        - paragraph [ref=f1e156]: "May opens with a flex: websockets goes from decision record to green on all four boards in about 2.5 hours of commit timestamps. The user's reply sets the month's tone: \"are you sure the code is lean and dry enough?\" Seven slices later, the same night, the library is 20% smaller."
        - paragraph [ref=f1e157]: "May 6 builds the machine that defines the month: the audit skills. May 11 and 12, at 170 and 148 commits, are the repo's all-time record days, and they are that machine at full throttle, every library audited back to back, every pass folding its lessons into the skill that ran it."
