name: Stable Promotion Request
description: Request promotion of an experimental release to stable
labels: ["release-cut"]
body:
  - type: markdown
    attributes:
      value: |
        Request a stable release for a library that has an experimental release. A maintainer will review and run the promotion workflow.

  - type: input
    id: library
    attributes:
      label: Library name(s)
      description: "The library or libraries to promote, comma-separated (e.g., timing, runner)"
      placeholder: timing
    validations:
      required: true

  - type: input
    id: tag
    attributes:
      label: Experimental tag(s)
      description: "The exact experimental tag(s) to promote, comma-separated. Several tags promote together as one wave, which is the normal shape when libraries were released together."
      placeholder: chumicro-timing-v0.2.0-experimental,chumicro-runner-v0.20.0-experimental
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why promote now?
      description: What makes this release ready for stable? Has it been tested on hardware? Used in a project?
      placeholder: |
        This release has been running on my ESP32-S3 weather station for two
        weeks without issues. The API is stable and the docs are complete.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification checklist
      description: Confirm you've done these before requesting promotion.
      options:
        - label: Preflight passes on the commit this tag points to
          required: true
        - label: Docs are complete and accurate (guide, API reference, examples)
          required: true
        - label: No known bugs or regressions
          required: true
        - label: The API is intentional (I understand that breaking changes after stable release require a major version bump)
          required: true
        - label: I have tested on at least one target runtime (CircuitPython, MicroPython, or CPython)
          required: true

