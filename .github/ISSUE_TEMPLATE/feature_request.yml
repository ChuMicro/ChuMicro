name: Feature Request
description: Suggest a new feature or improvement
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for ChuMicro? Describe it here. We welcome feature requests for existing libraries and proposals for new ones.

  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Which library does this relate to?
      options:
        - timing
        - runner
        - compat
        - msgpack
        - config
        - http-server
        - kvstore
        - mqtt
        - ntp
        - requests
        - sockets
        - websockets
        - wifi
        - New library
        - Infrastructure / tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? What are you trying to do that you can't do today?
      placeholder: |
        I want to append sensor readings to a file on a microSD card, but
        mounting the card and writing to it differs between CircuitPython
        and MicroPython, and a slow write stalls my runner loop. kvstore
        handles small values that survive a reboot, not bulk file writes.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work? Code examples are welcome.
      placeholder: |
        A runner-shaped SD card service that mounts through each runtime's
        own driver (sdcardio on CircuitPython, machine.SDCard on
        MicroPython) and writes buffered lines a chunk per tick.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you looked at other approaches? What are the tradeoffs?
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - label: I'm willing to submit a PR for this feature

