# Label definitions for the ChuMicro repository.
#
# Sync with: crazy-max/ghaction-github-labeler or manual creation.
# Format: each entry has name, color, and description.

# --- Type labels ---
- name: bug
  color: "d73a4a"
  description: "Something isn't working"

- name: feature
  color: "0075ca"
  description: "New functionality"

- name: refactor
  color: "cfd3d7"
  description: "Code improvement without behavior change"

- name: docs
  color: "0e8a16"
  description: "Documentation changes"

- name: infra
  color: "e4e669"
  description: "CI, tooling, scripts, or build system"

- name: test
  color: "bfd4f2"
  description: "Test-only changes"

# --- Library labels ---
- name: "lib:timing"
  color: "c5def5"
  description: "chumicro-timing library"

- name: "lib:runner"
  color: "c5def5"
  description: "chumicro-runner library"

- name: "lib:compat"
  color: "c5def5"
  description: "chumicro-compat library"

- name: "lib:msgpack"
  color: "c5def5"
  description: "chumicro-msgpack library"

- name: "lib:config"
  color: "c5def5"
  description: "chumicro-config library"

- name: "lib:http-server"
  color: "c5def5"
  description: "chumicro-http-server library"

- name: "lib:kvstore"
  color: "c5def5"
  description: "chumicro-kvstore library"

- name: "lib:mqtt"
  color: "c5def5"
  description: "chumicro-mqtt library"

- name: "lib:ntp"
  color: "c5def5"
  description: "chumicro-ntp library"

- name: "lib:requests"
  color: "c5def5"
  description: "chumicro-requests library"

- name: "lib:sockets"
  color: "c5def5"
  description: "chumicro-sockets library"

- name: "lib:websockets"
  color: "c5def5"
  description: "chumicro-websockets library"

- name: "lib:wifi"
  color: "c5def5"
  description: "chumicro-wifi library"

# --- Semver labels ---
- name: "semver:patch"
  color: "bfe5bf"
  description: "Bug fix, no API change"

- name: "semver:minor"
  color: "fef2c0"
  description: "New feature, backward-compatible"

- name: "semver:major"
  color: "f9d0c4"
  description: "Breaking change"

- name: "semver:none"
  color: "ededed"
  description: "No version bump needed (docs, infra, tests only)"

# --- Process labels ---
- name: "release-cut"
  color: "5319e7"
  description: "Stable release promotion"

- name: breaking
  color: "b60205"
  description: "Contains breaking API changes"

- name: "needs-review"
  color: "fbca04"
  description: "Awaiting code review"

- name: "board-test"
  color: "1d76db"
  description: "Hardware test report from a real device"

- name: blocked
  color: "000000"
  description: "Blocked on external dependency or decision"

- name: dependencies
  color: "0366d6"
  description: "Dependency or CI action version bump"

# --- Community labels (GitHub surfaces the first two in contributor UI) ---
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped, a fine first PR"

- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome a PR for this"

- name: question
  color: "d876e3"
  description: "Question rather than a defect or request"

- name: "needs-triage"
  color: "ededed"
  description: "Not yet reviewed by a maintainer"

- name: security
  color: "b60205"
  description: "Security-relevant; see SECURITY.md before discussing details"
