name: Sync labels

# Reconcile GitHub issue labels with the declarative definition in
# .github/labels.yml.  Runs on every push that touches the file and
# can be triggered manually to force a full sync.

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d  # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Keep labels that were created manually or by other tooling.
          # Only additions and renames are applied; nothing is deleted.
          skip-delete: true
