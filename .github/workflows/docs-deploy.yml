name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Documentation channel to deploy"
        type: choice
        options:
          - experimental
          - stable
        default: experimental
      libraries:
        description: "Comma-separated libraries to deploy (empty = all)"
        type: string
        default: ""

# Avoid concurrent deployments that could conflict on gh-pages.
concurrency:
  group: documentation-deploy
  cancel-in-progress: false

# Read-only token: the gh-pages push goes over GH_PAGES_DEPLOY_KEY (the
# checkout below configures origin for it), not this workflow's token.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history so mike can inspect existing version aliases on
          # the gh-pages branch.
          fetch-depth: 0
          # Deploy key with write access — GITHUB_TOKEN cannot push to
          # gh-pages when branch protection or deploy-key rules are active.
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pip
          key: docs-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            docs-pip-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        # May not exist yet on a fresh repository — the || true prevents
        # a failure on the very first deploy.
        run: git fetch origin gh-pages:gh-pages 2>/dev/null || true

      - name: Deploy documentation
        env:
          INPUT_LIBRARIES: ${{ inputs.libraries }}
        run: |
          # Push trigger always targets experimental; manual runs use the
          # selected channel input.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          library_flag=""
          if [[ -n "$INPUT_LIBRARIES" ]]; then
            library_flag="--libraries $INPUT_LIBRARIES"
          fi

          # $library_flag is intentionally unquoted so it word-splits into
          # separate arguments (--libraries <value>) or disappears when empty.
          python scripts/run.py docs-deploy --channel "$channel" $library_flag

      - name: Push to gh-pages
        run: git push origin gh-pages

      # The pages are live now, so tell the engines that read IndexNow
      # rather than waiting for their own crawl schedule.  A ping that
      # fails prints a warning and leaves the deploy green: the docs
      # shipped either way.  The promote workflow gets this through
      # docs_deploy_retry.py, which pings after its own push.
      - name: Ping IndexNow
        run: python scripts/index_now.py
        env:
          PYTHONPATH: scripts

  # ---------------------------------------------------------------------------
  # Host-root site.  GitHub serves one site per account, at the root of the
  # host every project path hangs below.  robots.txt, the ownership tokens,
  # and the IndexNow key only count when they answer there, so this job
  # rebuilds https://chumicro.com/ from the same package list the
  # landing page reads.  It follows the docs deploy because the hub links
  # into pages that deploy publishes.
  # ---------------------------------------------------------------------------
  publish-site-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    env:
      # Step-level `if` can read this; a job-level one cannot reach the
      # secrets context.  Absent key means the publish skips rather than
      # failing a deploy that already shipped the documentation.
      SITE_ROOT_DEPLOY_KEY: ${{ secrets.SITE_ROOT_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Report a missing deploy key
        if: env.SITE_ROOT_DEPLOY_KEY == ''
        run: |
          echo "::warning::SITE_ROOT_DEPLOY_KEY is not set." \
               "The host-root site at https://chumicro.com/ was not updated."

      - name: Configure SSH for the site repository
        if: env.SITE_ROOT_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SITE_ROOT_DEPLOY_KEY }}

      - name: Clone the site repository
        if: env.SITE_ROOT_DEPLOY_KEY != ''
        run: git clone git@github.com:ChuMicro/chumicro.github.io.git .site-repo

      - name: Configure git
        if: env.SITE_ROOT_DEPLOY_KEY != ''
        run: |
          git -C .site-repo config user.name "github-actions[bot]"
          git -C .site-repo config user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Publish the host-root site
        if: env.SITE_ROOT_DEPLOY_KEY != ''
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/publish_site_root.py \
            --clone-dir .site-repo \
            --message "Rebuild host-root site from ${GITHUB_SHA:0:7}" \
            --push
