name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Docs channel to deploy"
        type: choice
        options:
          - experimental
          - stable
        default: experimental

# Avoid concurrent deployments that could conflict on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip zensical mkdocstrings[python]
          pip install "git+https://github.com/squidfunk/mike.git"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages 2>/dev/null || true

      - name: Deploy docs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi
          python scripts/run.py docs-deploy --channel "$channel"

      - name: Push to gh-pages
        run: git push origin gh-pages
