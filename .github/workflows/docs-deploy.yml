name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Documentation channel to deploy"
        type: choice
        options:
          - experimental
          - stable
        default: experimental
      libraries:
        description: "Comma-separated libraries to deploy (empty = all)"
        type: string
        default: ""

# Avoid concurrent deployments that could conflict on gh-pages.
concurrency:
  group: documentation-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so mike can inspect existing version aliases on
          # the gh-pages branch.
          fetch-depth: 0
          # Deploy key with write access — GITHUB_TOKEN cannot push to
          # gh-pages when branch protection or deploy-key rules are active.
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip zensical mkdocstrings[python]
          # Install mike from git until the next release includes the
          # features we need (alias management improvements).
          pip install "git+https://github.com/squidfunk/mike.git"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        # May not exist yet on a fresh repository — the || true prevents
        # a failure on the very first deploy.
        run: git fetch origin gh-pages:gh-pages 2>/dev/null || true

      - name: Deploy documentation
        run: |
          # Push trigger always targets experimental; manual runs use the
          # selected channel input.
          if [ "${{ github.event_name }}" = "push" ]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          library_flag=""
          if [ -n "${{ inputs.libraries }}" ]; then
            library_flag="--libraries ${{ inputs.libraries }}"
          fi

          python scripts/run.py docs-deploy --channel "$channel" $library_flag

      - name: Push to gh-pages
        run: git push origin gh-pages
