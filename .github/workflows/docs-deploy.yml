name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Docs channel to deploy"
        type: choice
        options:
          - experimental
          - stable
        default: experimental

# Avoid concurrent deployments that could conflict on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip zensical mkdocstrings[python]
          pip install "git+https://github.com/squidfunk/mike.git"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages 2>/dev/null || true

      - name: Copy shared docs CSS
        run: |
          shared="support/docs/extra.css"
          for lib_dir in libraries/*/; do
            [ -f "${lib_dir}mkdocs.yml" ] || continue
            dest="${lib_dir}docs/stylesheets/"
            mkdir -p "$dest"
            cp "$shared" "$dest"
          done

      - name: Deploy docs for all libraries
        run: |
          # Push trigger → experimental.  workflow_dispatch → use channel input.
          if [ "${{ github.event_name }}" = "push" ]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          for lib_dir in libraries/*/; do
            [ -f "${lib_dir}mkdocs.yml" ] || continue
            lib_name=$(basename "$lib_dir")

            if [ "$channel" = "stable" ] && [ -f "${lib_dir}VERSION" ]; then
              version=$(cat "${lib_dir}VERSION" | tr -d '[:space:]')
              alias="stable"
            else
              version="dev"
              alias="experimental"
            fi

            echo "== Deploying ${lib_name} ${version} (${alias}) =="
            mike deploy \
              --deploy-prefix "$lib_name" \
              -F "${lib_dir}mkdocs.yml" \
              --alias-type redirect \
              --update-aliases \
              "$version" "$alias"
          done

      # Set stable as the default redirect for /<lib>/ -> /<lib>/stable/.
      # Only when deploying the stable channel.
      - name: Set stable as default
        if: inputs.channel == 'stable'
        run: |
          for lib_dir in libraries/*/; do
            [ -f "${lib_dir}mkdocs.yml" ] || continue
            lib_name=$(basename "$lib_dir")
            mike set-default \
              --deploy-prefix "$lib_name" \
              -F "${lib_dir}mkdocs.yml" \
              stable
          done

      - name: Generate landing page
        run: |
          python scripts/generate_landing_page.py > /tmp/landing.html
          # Splice the generated landing page into gh-pages
          git checkout gh-pages
          cp /tmp/landing.html index.html
          git add index.html
          git diff --cached --quiet || git commit -m "Regenerate landing page"
          git checkout -

      - name: Push to gh-pages
        run: git push origin gh-pages
