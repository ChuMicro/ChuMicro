name: Release

on:
  push:
    branches:
      - main
    paths:
      - "libraries/*/VERSION"
  workflow_dispatch:
    inputs:
      libraries:
        description: "Libraries to release (comma-separated, e.g. 'timing,runner'). Leave empty for all."
        type: string
        default: ""
      channel:
        description: "Release channel"
        type: choice
        options:
          - experimental
          - stable
        default: experimental
      dry_run:
        description: "Dry run — build but do not publish or tag"
        type: boolean
        default: false

# One release at a time to avoid race conditions on tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create tags and GitHub Releases
  id-token: write   # PyPI trusted publishing (OIDC)

jobs:
  detect:
    name: Detect changed libraries
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
      is_experimental: ${{ steps.channel.outputs.is_experimental }}
      suffix: ${{ steps.channel.outputs.suffix }}
      bundle_repo: ${{ steps.channel.outputs.bundle_repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: channel
        name: Determine release channel
        run: |
          # Push trigger → always experimental (auto-release on VERSION bump).
          # workflow_dispatch → use the channel input.
          if [ "${{ github.event_name }}" = "push" ]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          if [ "$channel" = "experimental" ]; then
            echo "is_experimental=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-experimental" >> "$GITHUB_OUTPUT"
            echo "bundle_repo=ChuMicro/ChuMicro-Bundle-Experimental" >> "$GITHUB_OUTPUT"
          else
            echo "is_experimental=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "bundle_repo=ChuMicro/ChuMicro-Bundle" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        name: Find libraries to release
        run: |
          suffix="${{ steps.channel.outputs.suffix }}"
          filter="${{ inputs.libraries }}"

          # Scan all libraries with VERSION files.
          entries="["
          first=true
          for version_file in libraries/*/VERSION; do
            [ -f "$version_file" ] || continue
            lib_dir=$(dirname "$version_file")
            lib_name=$(basename "$lib_dir")

            # Filter to requested libraries if specified.
            if [ -n "$filter" ]; then
              if ! echo ",$filter," | grep -q ",${lib_name},"; then
                continue
              fi
            fi

            version=$(cat "$version_file" | tr -d '[:space:]')
            tag="${lib_name}-v${version}${suffix}"

            # Skip if this tag already exists (re-run safety).
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — skipping ${lib_name}."
              continue
            fi

            if [ "$first" = true ]; then
              first=false
            else
              entries="${entries},"
            fi
            entries="${entries}{\"lib_name\":\"${lib_name}\",\"lib_dir\":\"${lib_dir}\",\"version\":\"${version}\",\"tag\":\"${tag}\"}"
          done
          entries="${entries}]"

          if [ "$entries" = "[]" ]; then
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":${entries}}" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: "Release ${{ matrix.lib_name }} v${{ matrix.version }}"
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Patch package name for experimental
        if: needs.detect.outputs.is_experimental == 'true'
        run: |
          # Rename the PyPI package to *-experimental in the ephemeral checkout.
          cd ${{ matrix.lib_dir }}
          sed -i 's/^name = "chumicro-${{ matrix.lib_name }}"/name = "chumicro-${{ matrix.lib_name }}-experimental"/' pyproject.toml
          # Point Bundle URL to the experimental bundle repo.
          sed -i 's|ChuMicro-Bundle"|ChuMicro-Bundle-Experimental"|' pyproject.toml
          # Point Documentation URL to the experimental docs channel.
          sed -i 's|/stable/"|/experimental/"|' pyproject.toml
          echo "Patched pyproject.toml URLs:"
          grep -E '^(name|Bundle|Documentation)' pyproject.toml

      - name: Build distribution
        run: python -m build ${{ matrix.lib_dir }}

      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.lib_dir }}/dist/

      - name: Create git tag
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ matrix.tag }}" -m "Release ${{ matrix.lib_name }} ${{ matrix.version }}"
          git push origin "${{ matrix.tag }}"

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "${{ matrix.lib_name }} v${{ matrix.version }}${{ needs.detect.outputs.suffix }}"
          prerelease: ${{ needs.detect.outputs.is_experimental == 'true' }}
          body: |
            Release of **chumicro-${{ matrix.lib_name }}** version **${{ matrix.version }}**${{ needs.detect.outputs.is_experimental == 'true' && ' (experimental)' || '' }}.
          files: ${{ matrix.lib_dir }}/dist/*
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to the channel-specific bundle repo for mip and circup distribution.
  # Stable pushes to ChuMicro/ChuMicro-Bundle.
  # Experimental pushes to ChuMicro/ChuMicro-Bundle-Experimental.
  # Prerequisites:
  #   1. Both bundle repos must exist (can be empty).
  #   2. A PAT with repo scope stored as the BUNDLE_TOKEN secret.
  # See Decision 0018 for the bundle repo layout and distribution model.
  # ---------------------------------------------------------------------------
  bundle:
    name: "Publish to ${{ needs.detect.outputs.bundle_repo }}"
    needs: [detect, release]
    if: needs.detect.outputs.has_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      MATRIX_JSON: ${{ needs.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install mpy-cross
        run: pip install mpy-cross

      - name: Stage bundle artifacts
        run: |
          python scripts/bundle.py stage-matrix .bundle-staging \
            --matrix "$MATRIX_JSON" \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }}

      - name: Generate bundle README
        run: |
          python scripts/bundle.py readme \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }} \
            -o .bundle-staging/README.md

      - name: Clone bundle repo
        run: |
          bundle_repo="${{ needs.detect.outputs.bundle_repo }}"
          git clone "https://x-access-token:${BUNDLE_TOKEN}@github.com/${bundle_repo}.git" .bundle-repo
        env:
          BUNDLE_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

      - name: Copy staging into bundle repo
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      - name: Create circup zips
        run: |
          today="$(date -u +%Y%m%d)"

          # Find the next available tag for today.  The cloned bundle repo
          # has all existing tags.  First release of the day uses YYYYMMDD;
          # subsequent releases append .1, .2, etc. so history is preserved.
          existing=$(git -C .bundle-repo tag -l "${today}*" | sort -V | tail -1)

          if [ -z "$existing" ]; then
            date_tag="${today}"
          elif [ "$existing" = "$today" ]; then
            date_tag="${today}.1"
          else
            n="${existing#${today}.}"
            date_tag="${today}.$((n + 1))"
          fi

          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"
          repo_name="${{ needs.detect.outputs.bundle_repo }}"
          repo_name="${repo_name##*/}"
          python scripts/bundle.py circup-zip .bundle-repo .circup-zips \
            --repo-name "$repo_name" --date-tag "$date_tag"

      - name: Push to bundle repo
        run: |
          cd .bundle-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          msg=$(jq -r '"Update: " + ([.include[] | .lib_name + " v" + .version] | join(", "))' <<< "$MATRIX_JSON")
          git commit -m "$msg"
          git push origin main

      - name: Create bundle release
        run: |
          bundle_repo="${{ needs.detect.outputs.bundle_repo }}"
          body=$(jq -r '"## Updated libraries\n\n" + ([.include[] | "- **" + .lib_name + "** v" + .version] | join("\n"))' <<< "$MATRIX_JSON")

          gh release create "${{ env.date_tag }}" \
            --repo "${bundle_repo}" \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}
