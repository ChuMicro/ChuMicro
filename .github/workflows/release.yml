name: Release

on:
  push:
    branches:
      - main
    paths:
      - "libraries/*/VERSION"
  workflow_dispatch:
    inputs:
      libraries:
        description: "Libraries to release (comma-separated, e.g. 'timing,runner'). Leave empty for all."
        type: string
        default: ""
      channel:
        description: "Release channel (stable must use promote.yml)"
        type: choice
        options:
          - experimental
        default: experimental
      dry_run:
        description: "Dry run — build but do not publish or tag"
        type: boolean
        default: false
  # Stable promotion uses promote.yml (standalone).  See Decision 0023.

# One release at a time to avoid race conditions on tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create tags and GitHub Releases
  id-token: write   # PyPI trusted publishing (OIDC)

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed libraries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
      is_experimental: ${{ steps.channel.outputs.is_experimental }}
      suffix: ${{ steps.channel.outputs.suffix }}
      bundle_repository: ${{ steps.channel.outputs.bundle_repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: channel
        name: Determine release channel
        run: |
          # Push trigger → always experimental (auto-release on VERSION bump).
          # workflow_dispatch → use the channel input.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          if [[ "$channel" == "experimental" ]]; then
            echo "is_experimental=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-experimental" >> "$GITHUB_OUTPUT"
            echo "bundle_repository=ChuMicro/ChuMicro-Bundle-Experimental" >> "$GITHUB_OUTPUT"
          else
            echo "is_experimental=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "bundle_repository=ChuMicro/ChuMicro-Bundle" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        name: Find libraries to release
        env:
          INPUT_LIBRARIES: ${{ inputs.libraries }}
        run: |
          suffix="${{ steps.channel.outputs.suffix }}"

          # Scan all libraries with VERSION files and build the release
          # matrix as a JSON array using jq for safe escaping.
          entries="[]"
          for version_file in libraries/*/VERSION; do
            [[ -f "$version_file" ]] || continue
            library_dir=$(dirname "$version_file")
            library_name=$(basename "$library_dir")

            # Filter to requested libraries if specified.
            if [[ -n "$INPUT_LIBRARIES" ]]; then
              if ! echo ",$INPUT_LIBRARIES," | grep -q ",${library_name},"; then
                continue
              fi
            fi

            version=$(tr -d '[:space:]' < "$version_file")
            tag="${library_name}-v${version}${suffix}"

            # Skip if this tag already exists (re-run safety).
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — skipping ${library_name}."
              continue
            fi

            entries=$(jq -c \
              --arg ln "$library_name" \
              --arg ld "$library_dir" \
              --arg v "$version" \
              --arg t "$tag" \
              '. + [{"library_name": $ln, "library_dir": $ld, "version": $v, "tag": $t}]' \
              <<< "$entries")
          done

          if [[ "$entries" == "[]" ]]; then
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
            matrix=$(jq -c '{"include": .}' <<< "$entries")
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: "Release ${{ matrix.library_name }} v${{ matrix.version }}"
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    # The "pypi" environment must be configured in repository settings with
    # trusted-publisher (OIDC) credentials so the publish step can authenticate.
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Patch package name for experimental
        if: needs.detect.outputs.is_experimental == 'true'
        run: python scripts/bundle.py patch-experimental ${{ matrix.library_dir }}

      - name: Build distribution
        run: python -m build ${{ matrix.library_dir }}

      - name: Create library source archive
        # Frozen snapshot of the library source attached to the GitHub
        # Release.  promote.yml downloads this archive instead of checking
        # out the tag, so stable promotions always use main's CI scripts
        # with the exact source that was tested as experimental.
        # See Decision 0023.
        run: |
          cd "${{ matrix.library_dir }}"
          zip -r "${GITHUB_WORKSPACE}/${{ matrix.library_name }}-v${{ matrix.version }}-source.zip" \
            src/ pyproject.toml VERSION README.md

      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.library_dir }}/dist/
          attestations: true

      - name: Create git tag
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ matrix.tag }}" -m "Release ${{ matrix.library_name }} ${{ matrix.version }}"
          git push origin "${{ matrix.tag }}"

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "${{ matrix.library_name }} v${{ matrix.version }}${{ needs.detect.outputs.suffix }}"
          prerelease: ${{ needs.detect.outputs.is_experimental == 'true' }}
          body: |
            Release of **chumicro-${{ matrix.library_name }}** version **${{ matrix.version }}**${{ needs.detect.outputs.is_experimental == 'true' && ' (experimental)' || '' }}.
          files: |
            ${{ matrix.library_dir }}/dist/*
            ${{ matrix.library_name }}-v${{ matrix.version }}-source.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to the channel-specific bundle repository for mip and circup
  # distribution.
  # Stable pushes to ChuMicro/ChuMicro-Bundle.
  # Experimental pushes to ChuMicro/ChuMicro-Bundle-Experimental.
  # Prerequisites:
  #   1. Both bundle repositories must exist (can be empty).
  #   2. Per-repository SSH deploy keys with write access, stored as secrets:
  #        BUNDLE_DEPLOY_KEY              → ChuMicro-Bundle (stable)
  #        EXPERIMENTAL_BUNDLE_DEPLOY_KEY → ChuMicro-Bundle-Experimental
  #      Deploy keys are single-repository scoped (least privilege) and can
  #      be added to branch-protection bypass lists.
  #   3. BUNDLE_TOKEN (PAT) for GitHub API calls (release creation).
  #      Deploy keys only grant git-level access; API operations still
  #      need a token.
  # See Decision 0018 for the bundle repository layout and distribution model.
  # ---------------------------------------------------------------------------
  bundle:
    name: "Publish to ${{ needs.detect.outputs.bundle_repository }}"
    needs: [detect, release]
    if: needs.detect.outputs.has_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_JSON: ${{ needs.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install mpy-cross
        run: pip install mpy-cross

      - name: Stage bundle artifacts
        # Compiles .py → .mpy and arranges library files into the bundle
        # directory layout expected by mip and circup.
        run: |
          python scripts/bundle.py stage-matrix .bundle-staging \
            --matrix "$MATRIX_JSON" \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }}

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ needs.detect.outputs.is_experimental == 'true' && secrets.EXPERIMENTAL_BUNDLE_DEPLOY_KEY || secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: |
          bundle_repository="${{ needs.detect.outputs.bundle_repository }}"
          git clone "git@github.com:${bundle_repository}.git" .bundle-repo

      - name: Copy staging into bundle repository
        # Overlay staged artifacts onto the bundle checkout.  The LICENSE
        # is copied so the bundle repository always carries the license.
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      - name: Generate bundle README
        run: |
          python scripts/bundle.py readme \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }} \
            --bundle-dir .bundle-repo \
            -o .bundle-repo/README.md

      - name: Create circup zips
        run: |
          date_tag=$(python scripts/bundle.py next-date-tag .bundle-repo)
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"

          repository_name="${{ needs.detect.outputs.bundle_repository }}"
          repository_name="${repository_name##*/}"
          python scripts/bundle.py circup-zip .bundle-repo .circup-zips \
            --repo-name "$repository_name" --date-tag "$date_tag"

      - name: Push to bundle repository
        run: |
          cd .bundle-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Nothing to push if the staging content is identical to what
          # was already in the bundle (e.g. a no-op re-run).
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          message=$(jq -r '"Update: " + ([.include[] | .library_name + " v" + .version] | join(", "))' <<< "$MATRIX_JSON")
          git commit -m "$message"

          # Tag the bundle release commit before pushing.  The tag is
          # pushed via SSH (deploy key) so it works with tag protection
          # rules.  gh release create then references the existing tag.
          git tag "${{ env.date_tag }}"
          git push origin main "${{ env.date_tag }}"

      - name: Create bundle release
        run: |
          bundle_repository="${{ needs.detect.outputs.bundle_repository }}"
          body=$(jq -r '"## Updated libraries\n\n" + ([.include[] | "- **" + .library_name + "** v" + .version] | join("\n"))' <<< "$MATRIX_JSON")

          # Create a GitHub Release in the bundle repository.  --verify-tag
          # ensures the tag was pushed in the previous step; it prevents
          # creating an orphaned release if the push failed.
          gh release create "${{ env.date_tag }}" \
            --repo "${bundle_repository}" \
            --verify-tag \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}
