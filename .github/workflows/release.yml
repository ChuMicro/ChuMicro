name: Release

on:
  push:
    branches:
      - main
    paths:
      - "libraries/*/VERSION"
      - "workbench/*/VERSION"
  workflow_dispatch:
    inputs:
      libraries:
        description: "Packages to release (comma-separated, e.g. 'timing,deploy'). Library and workbench package basenames are accepted. Leave empty for all."
        type: string
        default: ""
      channel:
        description: "Release channel (stable must use promote.yml)"
        type: choice
        options:
          - experimental
        default: experimental
      include_tagged:
        description: "Re-include packages whose release tag already exists (re-run escape hatch for the 'tag exists but bundle/publish never ran' trap; the publish stays idempotent via skip-existing + release update)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run — build but do not publish or tag"
        type: boolean
        default: false
  # Stable promotion uses promote.yml (standalone).  See Decision 0023.

# One release at a time to avoid race conditions on tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create tags and GitHub Releases
  id-token: write   # PyPI trusted publishing (OIDC)

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      library_matrix: ${{ steps.detect.outputs.library_matrix }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
      has_library_releases: ${{ steps.detect.outputs.has_library_releases }}
      is_experimental: ${{ steps.channel.outputs.is_experimental }}
      suffix: ${{ steps.channel.outputs.suffix }}
      bundle_repository: ${{ steps.channel.outputs.bundle_repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: channel
        name: Determine release channel
        run: |
          # Push trigger → always experimental (auto-release on VERSION bump).
          # workflow_dispatch → use the channel input.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            channel="experimental"
          else
            channel="${{ inputs.channel }}"
          fi

          if [[ "$channel" == "experimental" ]]; then
            echo "is_experimental=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-experimental" >> "$GITHUB_OUTPUT"
            echo "bundle_repository=ChuMicro/ChuMicro-Bundle-Experimental" >> "$GITHUB_OUTPUT"
          else
            echo "is_experimental=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "bundle_repository=ChuMicro/ChuMicro-Bundle" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: detect
        name: Find packages to release
        # release_matrix.py walks libraries/*/VERSION + workbench/*/VERSION,
        # filters by --libraries, skips existing tags, and emits the
        # has_releases / matrix / has_library_releases / library_matrix
        # outputs.  Workbench entries carry kind=workbench so the bundle
        # + validate-mip jobs filter them out (Decision 0032 rule 3 —
        # workbench ships to PyPI only, not circup / mip).
        run: |
          python scripts/release_matrix.py \
            --suffix="${{ steps.channel.outputs.suffix }}" \
            --libraries "${{ inputs.libraries }}" \
            ${{ inputs.include_tagged && '--include-tagged' || '' }}

  # Publishing to PyPI is immutable — nothing ships unless the full local
  # gate passes on the exact ref being released.  Self-contained (runs
  # preflight here rather than trusting a prior ci.yml run's status) so a
  # release from any ref is provably green.  (2026-07-05 CI stand-up; the
  # old workflow published on `needs: detect` alone.)
  preflight-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install workspace tooling
        run: python scripts/run.py setup

      - name: Prepare runtime lane binaries
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/run.py prepare-micropython
          python scripts/run.py prepare-circuitpython
          python scripts/run.py prepare-mpy-cross

      - name: Preflight
        run: python scripts/run.py preflight --coverage-threshold 94

  release:
    name: "Release ${{ matrix.library_name }} v${{ matrix.version }}"
    needs: [detect, preflight-gate]
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    # The "pypi" environment must be configured in repository settings with
    # trusted-publisher (OIDC) credentials so the publish step can authenticate.
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install workspace tooling
        # bundle_manager (patch-experimental below) imports chumicro_deploy
        # at module level, so this leg needs the full workspace environment,
        # not just `build` — requirements-dev carries `build` for the dist
        # step.  (First-run trap found 2026-07-05: bare `pip install build`
        # left every matrix leg dying on ModuleNotFoundError.)
        run: python scripts/run.py setup

      - name: Create library source archive
        # Frozen snapshot of the UNPATCHED library source attached to the
        # GitHub Release.  promote.yml downloads this archive to build the
        # stable package, so it must contain the original pyproject.toml
        # (not the experimental-patched one).  See Decision 0023.
        #
        # This step MUST run before patch-experimental.
        run: |
          cd "${{ matrix.library_dir }}"
          zip -r "${GITHUB_WORKSPACE}/chumicro-${{ matrix.library_name }}-v${{ matrix.version }}-source.zip" \
            src/ pyproject.toml VERSION README.md

      - name: Patch package name for experimental
        if: needs.detect.outputs.is_experimental == 'true'
        run: python scripts/bundle_manager.py patch-experimental ${{ matrix.library_dir }}

      - name: Build distribution
        run: python -m build ${{ matrix.library_dir }}

      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.library_dir }}/dist/
          attestations: true
          # PyPI uploads are immutable — a version can be published once.
          # If a prior run published this version but died before the tag
          # was written (below), the re-run would otherwise be rejected
          # forever.  skip-existing treats an already-present file as
          # success so the retry can reach the tag write.
          skip-existing: true

      # The GitHub Release is the LAST write of the job, and it creates the
      # tag.  softprops/action-gh-release creates refs/tags/<tag_name> at
      # target_commitish when the tag doesn't exist yet, so there is no
      # separate "git tag && push" step.  Ordering matters: the tag is the
      # idempotency key release_matrix.py checks, so it must not appear
      # until PyPI publish + the source archive are both in place.  A run
      # that fails earlier leaves the tag absent and re-runs cleanly
      # (publish is skip-existing; this step updates an existing release
      # rather than failing).
      - name: Create GitHub Release and tag
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          # Pin the tag to the exact commit that was built and gated, not a
          # possibly-newer default-branch HEAD.
          target_commitish: ${{ github.sha }}
          # Release name matches the tag so it can be copy-pasted directly
          # into promote.yml's experimental_tag input.
          name: ${{ matrix.tag }}
          prerelease: ${{ needs.detect.outputs.is_experimental == 'true' }}
          body: |
            Release of **chumicro-${{ matrix.library_name }}** version **${{ matrix.version }}**${{ needs.detect.outputs.is_experimental == 'true' && ' (experimental)' || '' }}.
          # Only the source archive is attached — dist artifacts are already
          # on PyPI and the source archive is the only file promote.yml needs.
          # overwrite_files (default true, set explicitly) makes a re-run
          # replace the same-named archive instead of erroring.
          files: chumicro-${{ matrix.library_name }}-v${{ matrix.version }}-source.zip
          overwrite_files: true
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to the channel-specific bundle repository for mip and circup
  # distribution.
  # Stable pushes to ChuMicro/ChuMicro-Bundle.
  # Experimental pushes to ChuMicro/ChuMicro-Bundle-Experimental.
  # Prerequisites (device bundle + host-side libraries channel):
  #   1. All four distribution repositories must exist (can be empty),
  #      default branch main:
  #        ChuMicro-Bundle / ChuMicro-Bundle-Experimental  (mip/circup)
  #        ChuMicro-Libraries / ChuMicro-Libraries-Experimental
  #          (host-side `chumicro-workspace library` source channel — B4)
  #   2. Per-repository SSH deploy keys with write access, stored as secrets:
  #        BUNDLE_DEPLOY_KEY                → ChuMicro-Bundle (stable)
  #        EXPERIMENTAL_BUNDLE_DEPLOY_KEY   → ChuMicro-Bundle-Experimental
  #        LIBRARIES_DEPLOY_KEY             → ChuMicro-Libraries (stable)
  #        EXPERIMENTAL_LIBRARIES_DEPLOY_KEY→ ChuMicro-Libraries-Experimental
  #      Deploy keys are single-repository scoped (least privilege) and can
  #      be added to branch-protection bypass lists.
  #   3. BUNDLE_TOKEN (PAT) for GitHub API calls (bundle release creation).
  #      Deploy keys only grant git-level access; API operations still
  #      need a token.  The libraries channel needs NO token: the consumer
  #      (chumicro_workspace.library_channel) reads raw index.json + tag
  #      tarballs (codeload) only, so tags + a main push suffice.
  # See Decision 0018 (bundle layout) and 0078 (libraries channel).
  # ---------------------------------------------------------------------------
  bundle:
    name: "Publish to ${{ needs.detect.outputs.bundle_repository }}"
    needs: [detect, release]
    if: needs.detect.outputs.has_library_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Filtered to library entries only — workbench packages (Decision
      # 0032 rule 3) skip bundle staging entirely; they have nothing to
      # ship to circup / mip.
      MATRIX_JSON: ${{ needs.detect.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # Single unified cache for all .tools/ artifacts (mpy-cross + unix-port).
      # Using separate cache actions for the same path causes the second
      # restore to overwrite the first, leading to subtle corruption.
      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Build mpy-cross compilers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Install workspace tooling
        # bundle_manager imports chumicro_deploy at module level (Decision
        # 0090 strip reuse) — staging dies without the workspace environment.
        run: python scripts/run.py setup

      - name: Stage bundle artifacts
        # Compiles .py → .mpy and arranges library files into the bundle
        # directory layout expected by mip and circup.
        run: |
          python scripts/bundle_manager.py stage-matrix .bundle-staging \
            --matrix "$MATRIX_JSON" \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }}

      # ---------------------------------------------------------------
      # Pre-publish validation: verify mip install + import works from
      # the staged artifacts BEFORE pushing to the live bundle repo.
      # This catches broken .mpy compilation or manifest errors early.
      # ---------------------------------------------------------------

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate staged bundle locally
        run: |
          libraries=$(jq -r '[.include[].library_name] | join(",")' <<< "$MATRIX_JSON")
          python scripts/run.py validate-mip \
            --staging-dir .bundle-staging \
            --libraries "$libraries"

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ needs.detect.outputs.is_experimental == 'true' && secrets.EXPERIMENTAL_BUNDLE_DEPLOY_KEY || secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: |
          bundle_repository="${{ needs.detect.outputs.bundle_repository }}"
          git clone "git@github.com:${bundle_repository}.git" .bundle-repo

      - name: Copy staging into bundle repository
        # Overlay staged artifacts onto the bundle checkout.  The LICENSE
        # is copied so the bundle repository always carries the license.
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      - name: Generate bundle README
        run: |
          python scripts/bundle_manager.py readme \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }} \
            --bundle-dir .bundle-repo \
            -o .bundle-repo/README.md

      - name: Create circup zips
        run: |
          date_tag=$(python scripts/bundle_manager.py next-date-tag .bundle-repo)
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"

          repository_name="${{ needs.detect.outputs.bundle_repository }}"
          repository_name="${repository_name##*/}"
          python scripts/bundle_manager.py circup-zip .bundle-repo .circup-zips \
            --repo-name "$repository_name" --date-tag "$date_tag"

      - name: Push to bundle repository
        # bundle_push.py builds the commit message from MATRIX_JSON,
        # commits + tags + pushes via the SSH deploy key configured above,
        # and exits 0 cleanly when staging is identical to the current
        # bundle head (no-op re-run safety).  Tag protection rules require
        # the SSH path; gh release create later references the pushed tag.
        run: |
          python scripts/bundle_push.py \
            --bundle-dir .bundle-repo \
            --tag "${{ env.date_tag }}" \
            --matrix "$MATRIX_JSON"

      - name: Create bundle release
        run: |
          bundle_repository="${{ needs.detect.outputs.bundle_repository }}"
          body=$(jq -r '"## Updated libraries\n\n" + ([.include[] | "- **" + .library_name + "** v" + .version] | join("\n"))' <<< "$MATRIX_JSON")

          # Create a GitHub Release in the bundle repository.  --verify-tag
          # ensures the tag was pushed in the previous step; it prevents
          # creating an orphaned release if the push failed.
          gh release create "${{ env.date_tag }}" \
            --repo "${bundle_repository}" \
            --verify-tag \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

  # ---------------------------------------------------------------------------
  # Post-publish smoke test: validate mip install from the live bundle repo.
  # The bundle job already validated locally before pushing; this confirms
  # the published artifacts are accessible via the github: URL scheme that
  # end users actually use.  CDN propagation delays may cause transient
  # failures, hence the retry logic in validate_mip_install.py.
  # ---------------------------------------------------------------------------
  validate-mip:
    name: Validate mip install
    needs: [detect, bundle]
    if: needs.detect.outputs.has_library_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same library-only filter as the bundle job.
      MATRIX_JSON: ${{ needs.detect.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate mip install and import
        run: |
          # Extract library names from the release matrix.
          libraries=$(jq -r '[.include[].library_name] | join(",")' <<< "$MATRIX_JSON")
          bundle_repository="${{ needs.detect.outputs.bundle_repository }}"
          # Strip the org prefix (ChuMicro/ChuMicro-Bundle → ChuMicro-Bundle).
          bundle_repo="${bundle_repository##*/}"

          python scripts/run.py validate-mip \
            --bundle-repo "$bundle_repo" \
            --libraries "$libraries"

  # ---------------------------------------------------------------------------
  # Publish the host-side libraries channel (B4, Decision 0078): a
  # whole-source-tree snapshot of every publishable library plus a root
  # index.json, tag-versioned, that `chumicro-workspace library
  # add/browse/update` reads.  Distinct from the device bundle above —
  # that ships deploy-flattened .py/.mpy for circup/mip; this ships each
  # library's curated tree (src/tests/examples/docs) for host-side use.
  #
  # The whole channel is re-snapshotted every release (the snapshot model:
  # every library built together as one self-consistent set), so this job
  # takes no matrix — only the channel (experimental here) and a fresh
  # date tag.  The consumer reads raw index.json + tag tarballs via
  # codeload, so an SSH push of main + a tag is all that is required (no
  # GitHub release, no BUNDLE_TOKEN).
  # ---------------------------------------------------------------------------
  libraries-channel:
    name: Publish libraries channel
    needs: [detect, release]
    if: needs.detect.outputs.has_library_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure SSH for libraries channel repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ needs.detect.outputs.is_experimental == 'true' && secrets.EXPERIMENTAL_LIBRARIES_DEPLOY_KEY || secrets.LIBRARIES_DEPLOY_KEY }}

      - name: Clone libraries channel repository
        run: |
          repository="${{ needs.detect.outputs.is_experimental == 'true' && 'ChuMicro/ChuMicro-Libraries-Experimental' || 'ChuMicro/ChuMicro-Libraries' }}"
          git clone "git@github.com:${repository}.git" .libraries-repo

      - name: Stage and push libraries channel
        # A UTC timestamp is the snapshot tag.  It's unique per run without
        # querying existing tags (no next-date-tag call — that lives in
        # bundle_manager, which pulls the chumicro_deploy import chain this
        # deliberately-light job doesn't install).  libraries_channel wipes
        # + rebuilds the clone's tree (except .git/) from the current
        # source, writes index.json for the tag, then bundle_push commits +
        # tags + pushes main.  Every run rewrites index.json with the new
        # tag, so the pushed commit always self-describes as its own tag.
        run: |
          snapshot_tag="$(date -u +%Y%m%d.%H%M%S)"
          python scripts/libraries_channel.py \
            --staging-dir .libraries-repo \
            --tag "$snapshot_tag" \
            ${{ needs.detect.outputs.is_experimental == 'true' && '--experimental' || '' }} \
            --push

