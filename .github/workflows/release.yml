name: Release

on:
  workflow_dispatch:
    inputs:
      libraries:
        description: "Libraries to release (comma-separated, e.g. 'timing,runner'). Leave empty for all."
        type: string
        default: ""
      dry_run:
        description: "Dry run — build but do not publish or tag"
        type: boolean
        default: false

# One release at a time to avoid race conditions on tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create tags and GitHub Releases
  id-token: write   # PyPI trusted publishing (OIDC)

jobs:
  detect:
    name: Detect changed libraries
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
      is_experimental: ${{ steps.branch.outputs.is_experimental }}
      suffix: ${{ steps.branch.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: branch
        name: Determine release channel
        run: |
          branch="${GITHUB_REF##refs/heads/}"
          if [ "$branch" = "develop" ]; then
            echo "is_experimental=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-experimental" >> "$GITHUB_OUTPUT"
          else
            echo "is_experimental=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        name: Find libraries to release
        run: |
          suffix="${{ steps.branch.outputs.suffix }}"
          filter="${{ inputs.libraries }}"

          # Scan all libraries with VERSION files.
          entries="["
          first=true
          for version_file in libraries/*/VERSION; do
            [ -f "$version_file" ] || continue
            lib_dir=$(dirname "$version_file")
            lib_name=$(basename "$lib_dir")

            # Filter to requested libraries if specified.
            if [ -n "$filter" ]; then
              if ! echo ",$filter," | grep -q ",${lib_name},"; then
                continue
              fi
            fi

            version=$(cat "$version_file" | tr -d '[:space:]')
            tag="${lib_name}-v${version}${suffix}"

            # Skip if this tag already exists (re-run safety).
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — skipping ${lib_name}."
              continue
            fi

            if [ "$first" = true ]; then
              first=false
            else
              entries="${entries},"
            fi
            entries="${entries}{\"lib_name\":\"${lib_name}\",\"lib_dir\":\"${lib_dir}\",\"version\":\"${version}\",\"tag\":\"${tag}\"}"
          done
          entries="${entries}]"

          if [ "$entries" = "[]" ]; then
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":${entries}}" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: "Release ${{ matrix.lib_name }} v${{ matrix.version }}"
    needs: detect
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Patch package name for experimental
        if: needs.detect.outputs.is_experimental == 'true'
        run: |
          # Rename the PyPI package to *-experimental in the ephemeral checkout.
          cd ${{ matrix.lib_dir }}
          sed -i 's/^name = "chumicro-${{ matrix.lib_name }}"/name = "chumicro-${{ matrix.lib_name }}-experimental"/' pyproject.toml
          echo "Patched package name:"
          grep '^name' pyproject.toml

      - name: Build distribution
        run: python -m build ${{ matrix.lib_dir }}

      - name: Publish to PyPI
        if: inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.lib_dir }}/dist/

      - name: Create git tag
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ matrix.tag }}" -m "Release ${{ matrix.lib_name }} ${{ matrix.version }}"
          git push origin "${{ matrix.tag }}"

      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "${{ matrix.lib_name }} v${{ matrix.version }}${{ needs.detect.outputs.suffix }}"
          prerelease: ${{ needs.detect.outputs.is_experimental == 'true' }}
          body: |
            Release of **chumicro-${{ matrix.lib_name }}** version **${{ matrix.version }}**${{ needs.detect.outputs.is_experimental == 'true' && ' (experimental)' || '' }}.
          files: ${{ matrix.lib_dir }}/dist/*
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to ChuMicro/chumicro-bundle for mip and circup distribution.
  # Prerequisites:
  #   1. The ChuMicro/chumicro-bundle repo must exist (can be empty).
  #   2. A PAT with repo scope stored as the BUNDLE_TOKEN secret.
  # See Decision 0018 for the bundle repo layout and distribution model.
  # ---------------------------------------------------------------------------
  bundle:
    name: "Publish to chumicro-bundle${{ needs.detect.outputs.suffix }}"
    needs: [detect, release]
    if: needs.detect.outputs.has_releases == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install mpy-cross
        run: pip install mpy-cross

      - name: Stage bundle artifacts
        run: |
          is_exp="${{ needs.detect.outputs.is_experimental }}"
          matrix='${{ needs.detect.outputs.matrix }}'
          echo "$matrix" | python3 -c "
          import json, sys, subprocess
          is_exp = '$is_exp' == 'true'
          data = json.load(sys.stdin)
          for entry in data['include']:
              cmd = [
                  sys.executable, 'scripts/bundle.py',
                  entry['lib_dir'], entry['version'], '.bundle-staging',
              ]
              if is_exp:
                  cmd.append('--experimental')
              subprocess.check_call(cmd)
          "

      - name: Clone bundle repo
        run: |
          git clone "https://x-access-token:${BUNDLE_TOKEN}@github.com/ChuMicro/chumicro-bundle.git" .bundle-repo
        env:
          BUNDLE_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

      - name: Update bundle and create circup zips
        run: |
          # Copy staged library directories into the bundle repo.
          cp -r .bundle-staging/* .bundle-repo/

          suffix="${{ needs.detect.outputs.suffix }}"
          date_tag="$(date -u +%Y%m%d)${suffix}"
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"

          # Determine which package directories were staged.
          # Experimental builds produce *_experimental/ dirs; stable produces base dirs.
          staged_pattern=".bundle-repo/chumicro_*"

          # Build circup-format zip: .py source bundle.
          mkdir -p .circup-py/lib
          for pkg_dir in $staged_pattern; do
            [ -d "$pkg_dir" ] || continue
            pkg=$(basename "$pkg_dir")
            rsync -a --include='*/' --include='*.py' --exclude='*' "$pkg_dir/" ".circup-py/lib/${pkg}/"
          done
          mkdir -p .circup-zips
          (cd .circup-py && zip -qr "../.circup-zips/chumicro-bundle-py-${date_tag}.zip" lib/)

          # Build circup-format zip: .mpy bytecode bundle.
          # Includes .py for testing modules (source-only, no .mpy compiled).
          mkdir -p .circup-mpy/lib
          for pkg_dir in $staged_pattern; do
            [ -d "$pkg_dir" ] || continue
            pkg=$(basename "$pkg_dir")
            # Copy .mpy files (compiled modules).
            rsync -a --include='*/' --include='*.mpy' --exclude='*' "$pkg_dir/" ".circup-mpy/lib/${pkg}/"
            # Copy testing modules (.py only — no .mpy counterparts).
            if [ -f "$pkg_dir/testing.py" ]; then
              mkdir -p ".circup-mpy/lib/${pkg}"
              cp "$pkg_dir/testing.py" ".circup-mpy/lib/${pkg}/testing.py"
            fi
            if [ -d "$pkg_dir/testing" ]; then
              rsync -a --include='*/' --include='*.py' --exclude='*' "$pkg_dir/testing/" ".circup-mpy/lib/${pkg}/testing/"
            fi
          done
          (cd .circup-mpy && zip -qr "../.circup-zips/chumicro-bundle-mpy-${date_tag}.zip" lib/)

      - name: Push to bundle repo
        run: |
          cd .bundle-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          suffix="${{ needs.detect.outputs.suffix }}"
          channel=""
          if [ -n "$suffix" ]; then
            channel=" (experimental)"
          fi

          matrix='${{ needs.detect.outputs.matrix }}'
          msg=$(echo "$matrix" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          libs = [e['lib_name'] + ' v' + e['version'] for e in data['include']]
          print('Update${channel}: ' + ', '.join(libs))
          ")
          git commit -m "$msg"
          git push origin main

      - name: Create bundle release
        run: |
          suffix="${{ needs.detect.outputs.suffix }}"
          is_exp="${{ needs.detect.outputs.is_experimental }}"
          pre_flag=""
          if [ "$is_exp" = "true" ]; then
            pre_flag="--prerelease"
          fi

          matrix='${{ needs.detect.outputs.matrix }}'
          body=$(echo "$matrix" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          lines = ['## Updated libraries', '']
          for e in data['include']:
              lines.append('- **' + e['lib_name'] + '** v' + e['version'])
          print('\n'.join(lines))
          ")

          gh release create "${{ env.date_tag }}" \
            --repo ChuMicro/chumicro-bundle \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            $pre_flag \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

