name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python scripts/run.py lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Run all Python versions even if one fails so the full
      # compatibility picture is visible in a single CI run.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run tests with coverage
        run: python scripts/run.py test --all

  # Syntax-check every examples/ file to catch import errors and typos
  # before they reach users.
  verify-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify examples
        run: python scripts/run.py verify-examples --all

  # Build documentation on PRs to catch rendering errors before merge.
  # Actual deployment happens in docs-deploy.yml on push to main.
  documentation-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip zensical mkdocstrings[python]

      - name: Build documentation
        run: python scripts/run.py docs --all

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip build

      - name: Build packages
        run: python scripts/run.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: libraries/*/dist/

  # Enforce that any library with source changes also bumps its VERSION file.
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check VERSION enforcement
        run: python scripts/check_version.py --base origin/${{ github.base_ref }}

  # Detect backwards-incompatible API changes by comparing the PR branch
  # against the base branch using griffe.
  api-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip griffe

      - name: Check API breakages
        run: python scripts/check_api.py --base origin/${{ github.base_ref }}


  # -------------------------------------------------------------------------
  # Runtime compatibility — pull request only to conserve CI minutes.
  # -------------------------------------------------------------------------
  micropython-compatibility:
    if: github.event_name == 'pull_request'
    name: MicroPython compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: mp-cache
        with:
          path: .tools
          key: micropython-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_micropython.py', 'scripts/prepare.py') }}

      - name: Install unix-port build dependencies
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
      - name: Prepare MicroPython unix-port runtime
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython
      - name: Run MicroPython compatibility tests
        run: python scripts/run.py test-micropython-compatibility

  circuitpython-compatibility:
    if: github.event_name == 'pull_request'
    name: CircuitPython compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: cp-cache
        with:
          path: .tools
          key: circuitpython-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_circuitpython.py', 'scripts/prepare.py') }}

      - name: Install unix-port build dependencies
        if: steps.cp-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
      - name: Prepare CircuitPython unix-port runtime
        if: steps.cp-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-circuitpython
      - name: Run CircuitPython compatibility tests
        run: python scripts/run.py test-circuitpython-compatibility
