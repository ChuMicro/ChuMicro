name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python scripts/run.py lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Run all Python versions even if one fails so the full
      # compatibility picture is visible in a single CI run.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run tests with coverage
        run: python scripts/run.py test --all

  test-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest

      - name: Run scripts infrastructure tests
        run: python scripts/run.py test-scripts

  # Syntax-check every examples/ file to catch import errors and typos
  # before they reach users.
  verify-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify examples
        run: python scripts/run.py verify-examples --all

  # Build documentation on PRs to catch rendering errors before merge.
  # Actual deployment happens in docs-deploy.yml on push to main.
  documentation-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip zensical mkdocstrings[python]

      - name: Build documentation
        run: python scripts/run.py docs --all

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip build

      - name: Build packages
        run: python scripts/run.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: libraries/*/dist/

  # Enforce that any library with source changes also bumps its VERSION file.
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check VERSION enforcement
        run: python scripts/check_version.py --base origin/${{ github.base_ref }}

  # Detect backwards-incompatible API changes by comparing the PR branch
  # against the base branch using griffe.
  api-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install tooling
        run: python -m pip install --upgrade pip griffe

      - name: Check API breakages
        run: python scripts/check_api.py --base origin/${{ github.base_ref }}


  # -------------------------------------------------------------------------
  # Runtime compatibility — pull request only to conserve CI minutes.
  # Parametrized as a matrix to avoid duplicating near-identical job
  # definitions for each runtime.
  # -------------------------------------------------------------------------
  runtime-compatibility:
    if: github.event_name == 'pull_request'
    name: "${{ matrix.runtime_label }} compatibility"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_label: MicroPython
            runtime_slug: micropython
          - runtime_label: CircuitPython
            runtime_slug: circuitpython
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: .tools
          key: ${{ matrix.runtime_slug }}-${{ hashFiles('target-runtimes.toml', format('scripts/prepare_{0}.py', matrix.runtime_slug), 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
      - name: "Prepare ${{ matrix.runtime_label }} unix-port runtime"
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-${{ matrix.runtime_slug }}
      - name: "Run ${{ matrix.runtime_label }} compatibility tests"
        run: python scripts/run.py test-${{ matrix.runtime_slug }}-compatibility

  # -------------------------------------------------------------------------
  # Validate mpy bytecode — build mpy-cross, stage all libraries into a
  # local bundle, and verify that MicroPython can install and import both
  # .py and .mpy6 formats via mip against a local HTTP server.
  # Catches broken mpy compilation or manifest errors before merge.
  # -------------------------------------------------------------------------
  validate-mpy:
    if: github.event_name == 'pull_request'
    name: Validate mpy bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: mpy-cross-cache
        with:
          path: .tools
          key: mpy-cross-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_mpy_cross.py', 'scripts/shared.py') }}

      - name: Build mpy-cross compilers
        if: steps.mpy-cross-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Stage all libraries
        run: |
          for version_file in libraries/*/VERSION; do
            library_dir=$(dirname "$version_file")
            version=$(tr -d '[:space:]' < "$version_file")
            python scripts/bundle_manager.py stage \
              "$library_dir" "$version" .bundle-staging
          done

      - name: Install unix-port build dependencies
        if: steps.mpy-cross-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        run: python scripts/run.py prepare-micropython

      - name: Validate mip install from staged bundle
        run: |
          python scripts/validate_mip_install.py \
            --staging-dir .bundle-staging

