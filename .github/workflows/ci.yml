name: Continuous Integration

# Design (2026-07-05 CI stand-up): the preflight job is a thin shell around
# `python scripts/run.py preflight` — the same 13-phase gate every local
# checkpoint runs.  CI cannot drift from the local gate because it does not
# re-enumerate the phases; preflight IS the definition of green.  The repo
# works direct-to-main, so everything runs on push as well as pull_request
# (the old workflow gated its deep checks to pull_request only, which meant
# they never ran).

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # check-version / check-api diff against origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      # Single unified cache for all .tools/ artifacts (unix-port runtimes +
      # mpy-cross).  Separate cache actions on the same path corrupt each
      # other — one key covers everything the prepare scripts produce.
      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install workspace tooling
        # Installs requirements-dev (ruff, pytest, chumicro_checks, jedi,
        # build backends, doc tooling) and the editable workspace packages —
        # the same environment `run.py preflight` assumes locally.  The old
        # lint job installed only ruff, so `python -m chumicro_checks` could
        # never run in CI.
        run: python scripts/run.py setup

      - name: Prepare runtime lane binaries
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/run.py prepare-micropython
          python scripts/run.py prepare-circuitpython
          python scripts/run.py prepare-mpy-cross

      - name: Preflight (13 phases — the local gate, verbatim)
        run: python scripts/run.py preflight --coverage-threshold 94

      - name: Upload build artifacts
        # Preflight's build phase produced these; publish them for
        # inspection and downstream jobs.
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: libraries/*/dist/
          if-no-files-found: ignore

  # CPython version-compatibility matrix for the host-side packages.
  # Preflight covers 3.14 (the dev pin); this job keeps the published
  # floor honest.  Unit tests only — the deep phases live in preflight.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install workspace tooling
        # `run.py test --all` spans the workbench packages (pyserial,
        # tomlkit, the test harness, …) — a bare pytest install left five
        # suites dying on collection in the first live run.  Same thin
        # shell as every other job: setup IS the environment definition.
        run: python scripts/run.py setup

      - name: Run tests
        run: python scripts/run.py test --all

  # Build mpy-cross, stage every library into a local bundle, and verify
  # MicroPython can mip-install and import both .py and .mpy formats.
  # Not a preflight phase (needs the staged-bundle topology), so it keeps
  # its own job — now on push too, not just pull_request.
  validate-mpy:
    name: Validate mpy bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install workspace tooling
        # bundle_manager (staging below) imports chumicro_deploy at module
        # level (Decision 0090 strip reuse) — a bare runner dies on
        # ModuleNotFoundError without the workspace environment.
        run: python scripts/run.py setup

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Build mpy-cross compilers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Stage all libraries
        run: |
          for version_file in libraries/*/VERSION; do
            library_dir=$(dirname "$version_file")
            version=$(tr -d '[:space:]' < "$version_file")
            python scripts/bundle_manager.py stage \
              "$library_dir" "$version" .bundle-staging
          done

      - name: Validate mip install from staged bundle
        run: python scripts/run.py validate-mip --staging-dir .bundle-staging
