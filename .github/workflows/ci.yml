name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python scripts/run.py lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run tests with coverage
        run: python scripts/run.py test --all

  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify examples
        run: python scripts/run.py verify-examples --all

  docs-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: python -m pip install --upgrade pip zensical mkdocstrings[python]

      - name: Build docs
        run: python scripts/run.py docs --all

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: python -m pip install --upgrade pip build

      - name: Build packages
        run: python scripts/run.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: libraries/*/dist/

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check VERSION enforcement
        run: python scripts/check_version.py --base origin/${{ github.base_ref }}

  api-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: python -m pip install --upgrade pip griffe

      - name: Check API breakages
        run: python scripts/check_api.py --base origin/${{ github.base_ref }}

  label-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check for semver label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels --jq '.[].name')
          if echo "$labels" | grep -q "^semver:"; then
            echo "Found semver label."
          else
            echo "::error::Missing required semver label (semver:patch, semver:minor, semver:major, or semver:none)."
            echo "Add a semver label to indicate the version impact of this PR."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Runtime compatibility — PR only to conserve CI minutes.
  # -------------------------------------------------------------------------
  micropython-compatibility:
    if: github.event_name == 'pull_request'
    name: MicroPython compatibility (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install unix-port build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
      - name: Prepare MicroPython unix-port runtime
        run: python scripts/run.py prepare-micropython
      - name: Run MicroPython compatibility tests
        run: python scripts/run.py test-micropython-compatibility

  circuitpython-compatibility:
    if: github.event_name == 'pull_request'
    name: CircuitPython compatibility (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install unix-port build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
      - name: Prepare CircuitPython unix-port runtime
        run: python scripts/run.py prepare-circuitpython
      - name: Run CircuitPython compatibility tests
        run: python scripts/run.py test-circuitpython-compatibility
