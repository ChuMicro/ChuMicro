name: Sync main with develop

# Keeps main in sync with develop automatically.  Non-library code (scripts,
# plans, support, CI) and library source land on main immediately.  Stable
# *releases* are decoupled — they only happen when promote.yml is run.
#
# The push uses GITHUB_TOKEN, which intentionally does NOT trigger downstream
# workflows (push-event suppression).  This is desired: we don't want every
# sync to fire release.yml or docs-deploy.yml.  Promote handles those.
#
# Requires: main branch protection must allow GitHub Actions to push
# (Settings → Branches → main → Allow specified actors to bypass).

on:
  push:
    branches: [develop]

concurrency:
  group: sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to develop
        run: |
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Fast-forward failed — main has diverged from develop."
            echo "Manual intervention required to reconcile the branches."
            exit 1
          fi

