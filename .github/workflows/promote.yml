name: Promote to stable

# Promotes an experimental release to stable.  Enter the experimental tag
# (e.g. timing-v0.3.0-experimental) in the ref field.  The library name
# and version are parsed from the tag automatically.
#
# The release runs inline via workflow_call so the full build, publish, and
# bundle work is visible in this single workflow run.  The workflow itself
# runs from main (latest scripts/workflows) while the library source is
# checked out from the tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Experimental tag to promote (e.g. timing-v0.3.0-experimental)"
        type: string
        required: true
      dry_run:
        description: "Dry run — validate but do not publish or tag"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write    # tags + GitHub Releases (release.yml)
  id-token: write    # PyPI trusted publishing (release.yml)
  actions: write     # trigger docs-deploy

jobs:
  validate:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      lib_name: ${{ steps.parse.outputs.lib_name }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse experimental tag
        id: parse
        run: |
          tag="${{ inputs.ref }}"
          echo "Tag: ${tag}"

          # Expect: <lib>-v<version>-experimental
          if [[ "$tag" =~ ^([a-z][a-z0-9_-]*)-v([0-9]+\.[0-9]+\.[0-9]+)-experimental$ ]]; then
            lib_name="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            echo "lib_name=${lib_name}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "✓ Promoting ${lib_name} v${version} from experimental to stable"
          else
            echo "::error::Expected an experimental tag like 'timing-v0.3.0-experimental', got '${tag}'."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Validate VERSION matches tag
        run: |
          lib_name="${{ steps.parse.outputs.lib_name }}"
          version="${{ steps.parse.outputs.version }}"
          version_file="libraries/${lib_name}/VERSION"

          if [ ! -f "$version_file" ]; then
            echo "::error::Library '${lib_name}' not found (no ${version_file})."
            exit 1
          fi

          file_version=$(cat "$version_file" | tr -d '[:space:]')
          if [ "$file_version" != "$version" ]; then
            echo "::error::VERSION file says ${file_version} but tag says ${version}."
            exit 1
          fi

          stable_tag="${lib_name}-v${version}"
          if git rev-parse "refs/tags/${stable_tag}" >/dev/null 2>&1; then
            echo "::error::Stable tag ${stable_tag} already exists."
            exit 1
          fi

          echo "✓ ${lib_name} v${version} ready for stable promotion"

  release:
    name: Release
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      libraries: ${{ needs.validate.outputs.lib_name }}
      channel: stable
      dry_run: ${{ inputs.dry_run }}
      checkout_ref: ${{ inputs.ref }}
    secrets: inherit

  docs:
    name: Deploy stable docs
    needs: [validate, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stable docs deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs-deploy.yml \
            --repo "${{ github.repository }}" \
            -f channel=stable \
            -f "libraries=${{ needs.validate.outputs.lib_name }}"
          echo "✓ Stable docs deploy triggered for ${{ needs.validate.outputs.lib_name }}."
