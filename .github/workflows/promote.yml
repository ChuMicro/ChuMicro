name: Promote to stable

# Promotes experimental releases to stable.
#
# HOW TO USE: run this workflow from the "main" branch.  Enter one or
# more experimental tags to promote, comma-separated (e.g.
# chumicro-timing-v0.3.0-experimental,chumicro-mqtt-v0.28.1-experimental).
# A whole wave goes in one run (Decision 0117): the publishes fan out as
# a matrix, then the bundle, channel and docs writes happen once each.
#
# The library source comes from the source archive attached to each
# experimental GitHub Release.  All scripts and build tooling come from
# main.  This guarantees CI improvements land in stable promotions
# without re-tagging.  See Decision 0023.
#
# A tag whose stable tag already exists drops out of the matrix, so
# re-dispatching a failed wave's full tag list is the resume path.

on:
  workflow_dispatch:
    inputs:
      experimental_tags:
        description: "Experimental tag(s) to promote, comma-separated (e.g. chumicro-timing-v0.3.0-experimental,chumicro-mqtt-v0.28.1-experimental)"
        type: string
        required: true
      dry_run:
        description: "Dry run — validate and build but do not publish or tag"
        type: boolean
        default: false
      allow_downgrade:
        description: "Skip the version-monotonicity guard. Only for a hotfix that intentionally republishes an older version as stable."
        type: boolean
        default: false
      include_tagged:
        description: "Keep packages whose stable tag already exists (deliberate re-publish; every downstream leg is idempotent). Normally leave off — already-promoted tags drop out on their own, which is what makes re-dispatching a failed wave safe."
        type: boolean
        default: false

# Serialize against release.yml: both workflows push to the shared bundle
# and libraries repos, so a promotion must not run concurrently with an
# experimental release.  Same repo-scoped group name as release.yml's
# `release` group — GitHub Actions queues across workflows that share it.
#
# The old one-run-per-package shape made this group a hazard: GitHub keeps
# one RUNNING plus at most one PENDING run per group, so bulk-dispatching a
# wave silently cancelled all but two, and scripts/promote_wave.py existed
# to dispatch strictly one at a time.  A wave is now a single run, so there
# is nothing to queue behind and the trap is unreachable rather than
# managed (Decision 0117).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write    # tags + GitHub Releases + push to gh-pages
  id-token: write    # PyPI trusted publishing (OIDC)

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Parse and validate every tag, emit the matrices the wave fans out over.
  # ---------------------------------------------------------------------------
  validate:
    name: Parse and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
      library_matrix: ${{ steps.validate.outputs.library_matrix }}
      gate_commits: ${{ steps.validate.outputs.gate_commits }}
      docs_libraries: ${{ steps.validate.outputs.docs_libraries }}
      has_promotions: ${{ steps.validate.outputs.has_promotions }}
      has_library_promotions: ${{ steps.validate.outputs.has_library_promotions }}
      has_docs_promotions: ${{ steps.validate.outputs.has_docs_promotions }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history AND tags: promote_matrix resolves each tag to the
          # commit the preflight gate checks out, and reads local refs to
          # decide whether a stable tag already exists.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: validate
        name: Validate tags, build promotion matrix
        # promote_matrix.py loops promote_validate.py over every tag, so a
        # one-tag promotion and a seventeen-tag wave apply identical rules:
        # the experimental tag exists, the source archive is attached, the
        # version is newer than the newest stable (unless allow_downgrade).
        # Packages already on stable drop out unless include_tagged.
        # Workbench and support packages (Decisions 0032 and 0111) carry
        # package_kind != library so the bundle, mip and channel jobs skip
        # them; packages without a mkdocs.yml stay out of docs_libraries.
        env:
          TAGS: ${{ inputs.experimental_tags }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          INCLUDE_TAGGED: ${{ inputs.include_tagged }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/promote_matrix.py

  # ---------------------------------------------------------------------------
  # Re-run the full local gate before an immutable stable PyPI publish.
  # Stable's source is the frozen experimental source zip, but it is rebuilt
  # with current tooling, so it must be provably green.  This gate checks out
  # the EXPERIMENTAL TAG's commit (not main): the source zip was frozen from
  # that ref, so gating that exact tree re-validates precisely what ships.
  #
  # The matrix is over DISTINCT commits, not over tags.  A wave cut from one
  # push gates once instead of once per package (Decision 0117); a wave
  # mixing commits gates once per commit.  Mirrors release.yml's
  # preflight-gate step-for-step otherwise.
  # ---------------------------------------------------------------------------
  preflight-gate:
    name: "Gate ${{ matrix.commit }}"
    needs: validate
    if: needs.validate.outputs.has_promotions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.gate_commits) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      # tools-full-: this job builds all three toolsets.  Keys are split
      # per produced toolset so a lighter job's save cannot poison this
      # restore with a circuitpython-less .tools whose cache "hit" also
      # skips the build-deps install needed to self-heal (see ci.yml
      # preflight for the full story).
      - uses: actions/cache@v6
        id: tools-cache
        with:
          path: .tools
          key: tools-full-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install workspace tooling
        run: python scripts/run.py setup

      - name: Prepare runtime lane binaries
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/run.py prepare-micropython
          python scripts/run.py prepare-circuitpython
          python scripts/run.py prepare-mpy-cross

      - name: Preflight
        run: python scripts/run.py preflight --coverage-threshold 94

  # ---------------------------------------------------------------------------
  # Build and publish each stable package to PyPI, in parallel.
  #
  # Every package is its own PyPI project with its own trusted publisher and
  # its own git tag, so the legs share no mutable state.  fail-fast: false
  # lets each leg report independently; the batched jobs below require the
  # whole matrix to have succeeded, so a partial wave publishes to PyPI but
  # never pushes a bundle describing a state that did not fully ship.
  # ---------------------------------------------------------------------------
  release:
    name: "Release ${{ matrix.library_name }} v${{ matrix.version }} (stable)"
    needs: [validate, preflight-gate]
    if: needs.validate.outputs.has_promotions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}

    # The "pypi" environment must be configured in repository settings with
    # trusted-publisher (OIDC) credentials so the publish step can authenticate.
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Download and unpack source archive
        # release_source.py replaces main's package source with the
        # frozen experimental source from the GitHub Release archive.
        # Works for libraries/, workbench/ and support/ alike.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_source.py \
            --tag "${{ matrix.experimental_tag }}" \
            --source-zip "${{ matrix.source_zip }}" \
            --library-dir "${{ matrix.library_dir }}"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distribution
        run: python -m build "${{ matrix.library_dir }}"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: "${{ matrix.library_dir }}/dist/"
          attestations: true
          # Same idempotency contract as release.yml: PyPI is immutable, so
          # a re-run after a partial failure must treat an already-present
          # file as success to reach the tag write below.
          skip-existing: true

      # The GitHub Release is the LAST write and it creates the stable tag.
      # promote_matrix drops packages whose stable tag exists, so writing it
      # last keeps a partially-failed wave re-runnable by re-dispatching the
      # same tag list.
      - name: Create GitHub Release and tag
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.stable_tag }}
          # Pin the tag to the exact commit this promotion ran from.
          target_commitish: ${{ github.sha }}
          name: ${{ matrix.stable_tag }}
          prerelease: false
          body: |
            Release of **chumicro-${{ matrix.library_name }}** version **${{ matrix.version }}**.
            Promoted from experimental tag `${{ matrix.experimental_tag }}`.
          # No file attachments — dist artifacts are already on PyPI and
          # CircuitPython/MicroPython users install from the bundle repo.
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish the whole wave to the stable bundle repository in ONE snapshot.
  #
  # Staging every library before validating and pushing is what removes the
  # dependency-ordering requirement the per-package shape had: the merged
  # tree contains the whole wave, and finalize-tag pins every manifest to
  # the one snapshot tag, so no library can reference a snapshot that does
  # not yet carry its deps (Decision 0117).
  #
  # Workbench and support packages (Decision 0032 rule 3, Decision 0111) are
  # already filtered out of library_matrix — they are CPython-only and have
  # nothing to ship to circup / mip.
  # ---------------------------------------------------------------------------
  bundle:
    name: Publish to ChuMicro/ChuMicro-Bundle
    needs: [validate, release]
    if: ${{ !inputs.dry_run && needs.validate.outputs.has_library_promotions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The date tag this job mints is the manifest job's correlation key.
    outputs:
      date_tag: ${{ steps.circup.outputs.date_tag }}
    env:
      MATRIX_JSON: ${{ needs.validate.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Download and unpack every source archive
        # Each promoted library's frozen source replaces main's copy before
        # staging, so the bundle ships exactly what PyPI got.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.include[]' <<< "$MATRIX_JSON" | while read -r entry; do
            python scripts/release_source.py \
              --tag "$(jq -r '.experimental_tag' <<< "$entry")" \
              --source-zip "$(jq -r '.source_zip' <<< "$entry")" \
              --library-dir "$(jq -r '.library_dir' <<< "$entry")"
          done

      # Single unified cache for all .tools/ artifacts (mpy-cross + unix-port).
      # Using separate cache actions for the same path causes the second
      # restore to overwrite the first, leading to subtle corruption.
      # tools-mp-mpy-: this job produces mpy-cross + micropython only,
      # so it must not share a key with jobs producing other toolsets.
      - uses: actions/cache@v6
        id: tools-cache
        with:
          path: .tools
          key: tools-mp-mpy-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Build mpy-cross compilers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Install workspace tooling
        # bundle_manager imports chumicro_deploy at module level (Decision
        # 0090 strip reuse) — staging dies without the workspace environment.
        run: python scripts/run.py setup

      - name: Stage bundle artifacts
        run: |
          python scripts/bundle_manager.py stage-matrix .bundle-staging \
            --matrix "$MATRIX_JSON"

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Bundle.git" .bundle-repo

      - name: Copy staging into bundle repository
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      # Validate against the MERGED tree (clone + overlay), not the staging
      # dir alone: a staged library's package.json references its deps by
      # bundle URL, and deps outside this wave only exist in the clone.
      - name: Validate merged bundle locally
        run: |
          libraries=$(jq -r '[.include[].library_name] | join(",")' <<< "$MATRIX_JSON")
          python scripts/run.py validate-mip \
            --staging-dir .bundle-repo \
            --libraries "$libraries"

      - name: Generate bundle README
        run: |
          python scripts/bundle_manager.py readme \
            --bundle-dir .bundle-repo \
            -o .bundle-repo/README.md

      - name: Create circup zips
        id: circup
        run: |
          # finalize-tag pins the staged manifests' dep placeholders to the
          # release tag, so installs resolve deps at the snapshot they were
          # validated with instead of the bundle repo's future HEAD.
          # --reuse-if-clean: a re-run after "push succeeded, release create
          # failed" reprints the already-pushed tag instead of minting a
          # fresh one on identical content (which would orphan the original).
          date_tag=$(python scripts/bundle_manager.py finalize-tag .bundle-repo --reuse-if-clean)
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"
          # Also a job output so the manifest job can key on it.
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"
          python scripts/bundle_manager.py circup-zip .bundle-repo .circup-zips \
            --repo-name "ChuMicro-Bundle" --date-tag "$date_tag"

      - name: Push to bundle repository
        run: |
          python scripts/bundle_push.py \
            --bundle-dir .bundle-repo \
            --tag "${{ env.date_tag }}" \
            --matrix "$MATRIX_JSON"

      - name: Create bundle release
        run: |
          body=$(jq -r '"## Promoted libraries\n\n" + ([.include[] | "- **" + .library_name + "** v" + .version] | join("\n"))' <<< "$MATRIX_JSON")

          # Idempotent: `gh release create` writes the release BEFORE
          # uploading assets and does not roll back on upload failure, so a
          # re-run must still reconcile the circup zips.  --clobber makes
          # the upload a no-op-safe overwrite; --verify-tag prevents an
          # orphaned release if the push above failed.
          if gh release view "${{ env.date_tag }}" --repo "ChuMicro/ChuMicro-Bundle" >/dev/null 2>&1; then
            gh release upload "${{ env.date_tag }}" --repo "ChuMicro/ChuMicro-Bundle" \
              --clobber .circup-zips/*.zip
          else
            gh release create "${{ env.date_tag }}" \
              --repo "ChuMicro/ChuMicro-Bundle" \
              --verify-tag \
              --title "Bundle ${{ env.date_tag }}" \
              --notes "$body" \
              .circup-zips/*.zip
          fi
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

  # ---------------------------------------------------------------------------
  # Post-publish smoke test: validate mip install from the live bundle repo.
  # The bundle job already validated locally before pushing; this confirms
  # the published artifacts are reachable via the github: URL scheme end
  # users actually use.  CDN propagation delays may cause transient
  # failures, hence the retry logic in validate_mip_install.py.
  # ---------------------------------------------------------------------------
  validate-mip:
    name: Validate mip install (stable)
    needs: [validate, bundle]
    if: ${{ !inputs.dry_run && needs.validate.outputs.has_library_promotions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_JSON: ${{ needs.validate.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # tools-mp-: this job builds only the micropython unix-port (see
      # ci.yml preflight for why keys are split per produced toolset).
      - uses: actions/cache@v6
        id: tools-cache
        with:
          path: .tools
          key: tools-mp-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate mip install and import
        run: |
          libraries=$(jq -r '[.include[].library_name] | join(",")' <<< "$MATRIX_JSON")
          python scripts/run.py validate-mip \
            --bundle-repo "ChuMicro-Bundle" \
            --libraries "$libraries"

  # ---------------------------------------------------------------------------
  # Deploy stable docs for the whole wave in ONE gh-pages push.
  #
  # Inlined rather than dispatching docs-deploy.yml: that workflow shares
  # the `documentation-deploy` concurrency group with push-triggered
  # experimental deploys, and a new run entering the group while a stable
  # deploy is pending silently cancels the pending one — so the stable
  # version never reaches gh-pages.  Running it here makes it part of the
  # promotion and immune to that cancellation.  A retry loop handles
  # transient push conflicts with concurrent experimental deploys.
  #
  # One pass for the wave replaces N racing pushes; docs_libraries already
  # excludes packages without a mkdocs.yml.
  # ---------------------------------------------------------------------------
  docs:
    name: Deploy stable docs
    needs: [validate, release]
    if: ${{ !inputs.dry_run && needs.validate.outputs.has_docs_promotions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATRIX_JSON: ${{ needs.validate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # mike inspects existing version aliases on gh-pages.
          fetch-depth: 0
          # The gh-pages ruleset blocks every ref update and bypasses only
          # OrganizationAdmin, DeployKey and the admin role, so GITHUB_TOKEN
          # cannot push here — the push is rejected with GH013 after the
          # PyPI publish has already happened.  Check out over the deploy
          # key so the later push carries an identity the rule lets through.
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install workspace tooling
        run: python scripts/run.py setup

      - name: Download and unpack every source archive
        # docs-deploy labels each version with read_version(library_dir),
        # so the tree must carry the promoted source, not main's current
        # VERSION — otherwise a package that moved on since the tag would
        # publish the wrong version as "stable".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.include[]' <<< "$MATRIX_JSON" | while read -r entry; do
            python scripts/release_source.py \
              --tag "$(jq -r '.experimental_tag' <<< "$entry")" \
              --source-zip "$(jq -r '.source_zip' <<< "$entry")" \
              --library-dir "$(jq -r '.library_dir' <<< "$entry")"
          done

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy and push stable docs for the wave
        # docs_deploy_retry.py fetches gh-pages, runs run.py docs-deploy,
        # and PUSHES — retrying when a concurrent experimental deploy
        # forces a re-base.  Calling `run.py docs-deploy` directly instead
        # commits to the local branch, never pushes, and still exits 0, so
        # the job goes green having shipped nothing (observed on the first
        # live run of this workflow, promoting workspace 0.52.1).
        run: |
          python scripts/docs_deploy_retry.py \
            --channel stable \
            --libraries "${{ needs.validate.outputs.docs_libraries }}"

  # ---------------------------------------------------------------------------
  # Publish the host-side libraries channel to the STABLE source repo
  # (B4, Decision 0078).  Mirrors release.yml's libraries-channel job but
  # targets ChuMicro/ChuMicro-Libraries via LIBRARIES_DEPLOY_KEY.  Gated to
  # library promotions — a workbench-only wave changes no libraries/ tree,
  # so there is nothing to re-snapshot.
  #
  # Behavior note: the producer re-snapshots the WHOLE current libraries/
  # tree from main (the snapshot model wants one self-consistent set; it
  # has no per-library overlay mode).  So the stable channel is refreshed
  # to main's current source on each promotion wave — that refresh cadence
  # is what makes it lag the experimental channel.  It is NOT a per-library
  # overlay of the frozen promoted source; see the release-fabric-readiness
  # workstream note.  Running once per wave rather than once per package
  # replaces N identical snapshots with one.
  # ---------------------------------------------------------------------------
  libraries-channel:
    name: Publish libraries channel (stable)
    needs: [validate, release]
    if: ${{ !inputs.dry_run && needs.validate.outputs.has_library_promotions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The snapshot tag this job mints is recorded by the manifest job.
    outputs:
      snapshot_tag: ${{ steps.stage.outputs.snapshot_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure SSH for libraries channel repository
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.LIBRARIES_DEPLOY_KEY }}

      - name: Clone libraries channel repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Libraries.git" .libraries-repo

      - name: Stage and push libraries channel
        id: stage
        # A UTC timestamp is the snapshot tag — unique per run without a
        # next-date-tag call (that lives in bundle_manager, which pulls the
        # chumicro_deploy import chain this light job doesn't install).
        # libraries_channel wipes + rebuilds the clone's tree (except
        # .git/) from the current source, writes index.json for the tag,
        # then bundle_push commits + tags + pushes main.
        run: |
          snapshot_tag="$(date -u +%Y%m%d.%H%M%S)"
          # Job output so the manifest job can pair it with the bundle tag.
          echo "snapshot_tag=${snapshot_tag}" >> "$GITHUB_OUTPUT"
          python scripts/libraries_channel.py \
            --staging-dir .libraries-repo \
            --tag "$snapshot_tag" \
            --push

  # ---------------------------------------------------------------------------
  # Correlation manifest (Decision 0112), stable half.  release.yml writes the
  # experimental channel's releases.json; without this job the stable channel
  # — the one every documented install path points at — had no correlation
  # index at all, so a stable bundle tag resolved to no package versions and a
  # stable PyPI version resolved to no snapshot.  Same shape as release.yml's
  # manifest job: runs after both channel publishers so it has both snapshot
  # tags, gated on library promotions (a workbench-only wave has no bundle or
  # libraries snapshot to correlate), and writes to the bundle repo because it
  # overlays rather than wiping — the libraries repo rebuilds its tree each run
  # and would drop the accumulated index.
  # ---------------------------------------------------------------------------
  manifest:
    name: Publish release manifest
    needs: [validate, bundle, libraries-channel]
    if: ${{ !inputs.dry_run && needs.validate.outputs.has_library_promotions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_JSON: ${{ needs.validate.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Bundle.git" .bundle-repo

      - name: Record and push releases.json
        # release_manifest replaces this run's entry in place (keyed by
        # channel + bundle tag), so a re-run rewrites its row and the push is
        # a clean no-op when nothing changed — idempotent like the other legs.
        # The clone follows the bundle job, so it already carries this wave's
        # bundle tree; only releases.json changes here.
        run: |
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/release_manifest.py \
            --index .bundle-repo/releases.json \
            --channel stable \
            --matrix "$MATRIX_JSON" \
            --bundle-tag "${{ needs.bundle.outputs.date_tag }}" \
            --libraries-tag "${{ needs.libraries-channel.outputs.snapshot_tag }}" \
            --published-at "$published_at"
          cd .bundle-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first, then diff the index: `git diff` alone ignores an
          # untracked file, so the first-ever run (releases.json absent — the
          # stable case until this job lands) would otherwise read "unchanged"
          # and never push.  --cached sees the new file, and stays a clean
          # no-op on a byte-identical re-run.
          git add releases.json
          if git diff --cached --quiet; then
            echo "releases.json unchanged — nothing to push."
          else
            git commit -m "release manifest: ${{ needs.bundle.outputs.date_tag }}"
            git push origin HEAD:main
          fi
