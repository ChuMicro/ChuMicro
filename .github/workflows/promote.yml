name: Promote libraries to stable

# Releases selected libraries as stable.  Triggers release.yml with
# channel=stable for the named libraries, then deploys stable docs.
#
# Release branches: for hotfixes against an older version, create a branch
# from the stable tag (e.g. `release/timing-v0.2.x`) and run release.yml
# manually on that ref.

on:
  workflow_dispatch:
    inputs:
      libraries:
        description: "Libraries to release as stable (comma-separated, e.g. 'timing,runner')."
        type: string
        required: true
      dry_run:
        description: "Dry run — validate but do not publish or tag"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write          # required to trigger other workflows

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate libraries
        run: |
          IFS=',' read -ra libs <<< "${{ inputs.libraries }}"
          for lib in "${libs[@]}"; do
            lib=$(echo "$lib" | xargs)
            version_file="libraries/${lib}/VERSION"
            if [ ! -f "$version_file" ]; then
              echo "::error::Library '${lib}' not found (no ${version_file})."
              exit 1
            fi
            version=$(cat "$version_file" | tr -d '[:space:]')
            tag="${lib}-v${version}"
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::warning::${lib} v${version} already has stable tag ${tag}."
            else
              echo "  ${lib} v${version} → ${tag}"
            fi
          done

      - name: Trigger stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(-f "channel=stable" -f "libraries=${{ inputs.libraries }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(-f "dry_run=true")
          fi
          gh workflow run release.yml "${args[@]}"
          echo "✓ Stable release triggered for: ${{ inputs.libraries }}"
          echo "  Monitor: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml"

      - name: Trigger stable docs deploy
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs-deploy.yml -f channel=stable
          echo "✓ Stable docs deploy triggered."
