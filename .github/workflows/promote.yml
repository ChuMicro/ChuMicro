name: Promote libraries to stable

# Releases selected libraries from experimental (develop) to stable (main).
#
# Flow:
#   1. Ensures main is in sync with develop (idempotent fast-forward).
#   2. Validates the requested libraries exist and have unreleased versions.
#   3. Triggers release.yml on main for the specified libraries.
#   4. Triggers docs-deploy.yml on main to update stable docs.
#
# If no libraries are specified, this is a sync-only run (step 4 still
# deploys docs so stable docs stay current).

on:
  workflow_dispatch:
    inputs:
      libraries:
        description: "Libraries to release as stable (comma-separated, e.g. 'timing,runner'). Leave empty for sync + docs only."
        type: string
        default: ""
      dry_run:
        description: "Dry run — validate and sync but do not publish or tag"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write          # required to trigger other workflows

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main with develop
        run: |
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Fast-forward failed — main has diverged from develop."
            exit 1
          fi
          echo "✓ Main is in sync with develop."

      - name: Validate libraries
        if: inputs.libraries != ''
        run: |
          IFS=',' read -ra libs <<< "${{ inputs.libraries }}"
          for lib in "${libs[@]}"; do
            lib=$(echo "$lib" | xargs)
            version_file="libraries/${lib}/VERSION"
            if [ ! -f "$version_file" ]; then
              echo "::error::Library '${lib}' not found (no ${version_file})."
              exit 1
            fi
            version=$(cat "$version_file" | tr -d '[:space:]')
            tag="${lib}-v${version}"
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::warning::${lib} v${version} already has stable tag ${tag}."
            else
              echo "  ${lib} v${version} → ${tag}"
            fi
          done

      - name: Trigger stable release
        if: inputs.libraries != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--ref main -f "libraries=${{ inputs.libraries }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(-f "dry_run=true")
          fi
          gh workflow run release.yml "${args[@]}"
          echo "✓ Stable release triggered for: ${{ inputs.libraries }}"
          echo "  Monitor: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml"

      - name: Trigger stable docs deploy
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs-deploy.yml --ref main
          echo "✓ Stable docs deploy triggered."
