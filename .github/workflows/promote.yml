name: Promote to stable

# Promotes an experimental release to stable.
#
# HOW TO USE: in the "Use workflow from" dropdown above, select the
# experimental tag to promote (e.g. timing-v0.1.15-experimental).
# The library name and version are parsed from the tag automatically.
#
# The release runs inline via workflow_call so the full build, publish, and
# bundle work is visible in this single workflow run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate but do not publish or tag"
        type: boolean
        default: false

permissions:
  contents: write    # tags + GitHub Releases (release.yml)
  id-token: write    # PyPI trusted publishing (release.yml)
  actions: write     # trigger docs-deploy

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Parse tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lib_name: ${{ steps.parse.outputs.lib_name }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse experimental tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Tag: ${TAG}"

          # Match the tag format: <library>-v<semver>-experimental
          # Capture group 1 = library name, capture group 2 = version.
          if [[ "$TAG" =~ ^([a-z][a-z0-9_-]*)-v([0-9]+\.[0-9]+\.[0-9]+)-experimental$ ]]; then
            lib_name="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            echo "lib_name=${lib_name}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "✓ Promoting ${lib_name} v${version} from experimental to stable"
          else
            echo "::error::Expected an experimental tag in 'Use workflow from' (e.g. timing-v0.3.0-experimental), got '${TAG}'."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # Full history needed to check whether the stable tag already exists.
          fetch-depth: 0

      - name: Validate VERSION matches tag
        # Three safety checks before proceeding:
        #   1. The library directory and VERSION file must exist.
        #   2. The VERSION file content must match the tag's version.
        #   3. A stable tag for this version must not already exist.
        run: |
          lib_name="${{ steps.parse.outputs.lib_name }}"
          version="${{ steps.parse.outputs.version }}"
          version_file="libraries/${lib_name}/VERSION"

          if [[ ! -f "$version_file" ]]; then
            echo "::error::Library '${lib_name}' not found (no ${version_file})."
            exit 1
          fi

          file_version=$(tr -d '[:space:]' < "$version_file")
          if [[ "$file_version" != "$version" ]]; then
            echo "::error::VERSION file says ${file_version} but tag says ${version}."
            exit 1
          fi

          stable_tag="${lib_name}-v${version}"
          if git rev-parse "refs/tags/${stable_tag}" >/dev/null 2>&1; then
            echo "::error::Stable tag ${stable_tag} already exists."
            exit 1
          fi

          echo "✓ ${lib_name} v${version} ready for stable promotion"

  # Delegate to the shared release workflow in stable mode.  Using
  # workflow_call keeps all build/publish/bundle steps visible in this
  # single workflow run rather than spawning a separate run.
  #
  # PyPI trusted publisher for stable packages is configured for
  # promote.yml (the top-level caller).  Experimental packages use
  # release.yml directly.  Sigstore certificates carry the top-level
  # caller's identity, so each channel's publisher must match the
  # workflow that actually initiates the run.
  release:
    name: Release
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      libraries: ${{ needs.validate.outputs.lib_name }}
      channel: stable
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # Trigger docs deployment as a separate workflow_dispatch rather than
  # workflow_call because docs-deploy.yml has its own concurrency group
  # and push-to-gh-pages logic that should not nest inside this run.
  docs:
    name: Deploy stable docs
    needs: [validate, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger stable docs deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs-deploy.yml \
            --repo "${{ github.repository }}" \
            -f channel=stable \
            -f "libraries=${{ needs.validate.outputs.lib_name }}"
          echo "✓ Stable docs deploy triggered for ${{ needs.validate.outputs.lib_name }}."
