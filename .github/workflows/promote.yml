name: Promote to stable

# Promotes an experimental release to stable.
#
# HOW TO USE: run this workflow from the "main" branch.  Enter the
# experimental tag to promote (e.g. chumicro-timing-v0.3.0-experimental) as input.
#
# The library source comes from the source archive attached to the
# experimental GitHub Release.  All scripts and build tooling come from
# main.  This guarantees CI improvements land in stable promotions
# without re-tagging.  See Decision 0023.

on:
  workflow_dispatch:
    inputs:
      experimental_tag:
        description: "Experimental tag to promote (e.g. chumicro-timing-v0.3.0-experimental, chumicro-deploy-v0.0.1-experimental)"
        type: string
        required: true
      dry_run:
        description: "Dry run — validate and build but do not publish or tag"
        type: boolean
        default: false

# Serialize against release.yml: both workflows push to the shared bundle
# and libraries repos, so a promotion must not run concurrently with an
# experimental release.  Same repo-scoped group name as release.yml's
# `release` group — GitHub Actions queues across workflows that share it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write    # tags + GitHub Releases + push to gh-pages
  id-token: write    # PyPI trusted publishing (OIDC)

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Parse the tag, verify preconditions, confirm the source archive exists.
  # ---------------------------------------------------------------------------
  validate:
    name: Parse and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library_name: ${{ steps.validate.outputs.library_name }}
      version: ${{ steps.validate.outputs.version }}
      stable_tag: ${{ steps.validate.outputs.stable_tag }}
      library_dir: ${{ steps.validate.outputs.library_dir }}
      package_kind: ${{ steps.validate.outputs.package_kind }}
      source_zip: ${{ steps.validate.outputs.source_zip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: validate
        name: Parse, locate, validate preconditions
        # promote_validate.py parses the experimental tag, locates the
        # source package under libraries/ or workbench/, and verifies
        # the experimental tag exists, the stable tag does not, and the
        # source archive is attached to the experimental GitHub Release.
        # Workbench packages (Decision 0032 rule 3) get package_kind=workbench
        # so the bundle + validate-mip jobs further down skip them.
        env:
          TAG: ${{ inputs.experimental_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/promote_validate.py

  # ---------------------------------------------------------------------------
  # Re-run the full local gate before an immutable stable PyPI publish.
  # Stable's source is the frozen experimental source zip, but it is rebuilt
  # here with current tooling, so it must be provably green.  This gate
  # checks out the EXPERIMENTAL TAG being promoted (not main): the source
  # zip was frozen from that ref, so gating on that exact tree with its own
  # pinned tooling re-validates precisely what ships.  Mirrors release.yml's
  # preflight-gate step-for-step (Python 3.14, .tools cache, run.py setup,
  # lane prep on cache miss, preflight --coverage-threshold 94).
  # ---------------------------------------------------------------------------
  preflight-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # The experimental tag being promoted — the exact frozen tree,
          # NOT main.  promote_validate.py (the validate job) already
          # confirmed this tag exists.
          ref: ${{ inputs.experimental_tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install workspace tooling
        run: python scripts/run.py setup

      - name: Prepare runtime lane binaries
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/run.py prepare-micropython
          python scripts/run.py prepare-circuitpython
          python scripts/run.py prepare-mpy-cross

      - name: Preflight
        run: python scripts/run.py preflight --coverage-threshold 94

  # ---------------------------------------------------------------------------
  # Build and publish the stable package to PyPI.
  # ---------------------------------------------------------------------------
  release:
    name: "Release ${{ needs.validate.outputs.library_name }} v${{ needs.validate.outputs.version }} (stable)"
    needs: [validate, preflight-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Download and unpack source archive
        # release_source.py replaces main's package source with the
        # frozen experimental source from the GitHub Release archive.
        # Works for both libraries/<name>/ and workbench/<name>/.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_source.py \
            --tag "${{ inputs.experimental_tag }}" \
            --source-zip "${{ needs.validate.outputs.source_zip }}" \
            --library-dir "${{ needs.validate.outputs.library_dir }}"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distribution
        run: python -m build "${{ needs.validate.outputs.library_dir }}"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "${{ needs.validate.outputs.library_dir }}/dist/"
          attestations: true
          # Same idempotency contract as release.yml: PyPI is immutable, so
          # a re-run after a partial failure must treat an already-present
          # file as success to reach the tag write below.
          skip-existing: true

      # The GitHub Release is the LAST write and it creates the stable tag
      # (mirrors release.yml).  promote_validate.py requires the stable tag
      # to be absent, so writing it last keeps a partially-failed promotion
      # re-runnable end to end.
      - name: Create GitHub Release and tag
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.stable_tag }}
          # Pin the tag to the exact commit this promotion ran from.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.stable_tag }}
          prerelease: false
          body: |
            Release of **chumicro-${{ needs.validate.outputs.library_name }}** version **${{ needs.validate.outputs.version }}**.
            Promoted from experimental tag `${{ inputs.experimental_tag }}`.
          # No file attachments — dist artifacts are already on PyPI and
          # CircuitPython/MicroPython users install from the bundle repo.
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to the stable bundle repository for mip and circup distribution.
  # ---------------------------------------------------------------------------
  bundle:
    name: Publish to ChuMicro/ChuMicro-Bundle
    needs: [validate, release]
    # Workbench packages (Decision 0032 rule 3) skip the bundle path —
    # they're CPython-only and have nothing to ship to circup / mip.
    if: ${{ !inputs.dry_run && needs.validate.outputs.package_kind == 'library' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # Intentionally duplicates the download+unpack from the release job.
      # Each job runs on a separate runner, and artifact-passing would add
      # complexity for a lightweight download that only happens on promotion.
      - name: Download and unpack source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_source.py \
            --tag "${{ inputs.experimental_tag }}" \
            --source-zip "${{ needs.validate.outputs.source_zip }}" \
            --library-dir "${{ needs.validate.outputs.library_dir }}"

      # Single unified cache for all .tools/ artifacts (mpy-cross + unix-port).
      # Using separate cache actions for the same path causes the second
      # restore to overwrite the first, leading to subtle corruption.
      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Build mpy-cross compilers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Install workspace tooling
        # bundle_manager imports chumicro_deploy at module level (Decision
        # 0090 strip reuse) — staging dies without the workspace environment.
        run: python scripts/run.py setup

      - name: Stage bundle artifacts
        run: |
          python scripts/bundle_manager.py stage \
            "${{ needs.validate.outputs.library_dir }}" \
            "${{ needs.validate.outputs.version }}" \
            .bundle-staging

      # ---------------------------------------------------------------
      # Pre-publish validation: verify mip install + import works from
      # the staged artifacts BEFORE pushing to the live bundle repo.
      # ---------------------------------------------------------------

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate staged bundle locally
        run: |
          python scripts/run.py validate-mip \
            --staging-dir .bundle-staging \
            --libraries "${{ needs.validate.outputs.library_name }}"

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Bundle.git" .bundle-repo

      - name: Copy staging into bundle repository
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      - name: Generate bundle README
        run: |
          python scripts/bundle_manager.py readme \
            --bundle-dir .bundle-repo \
            -o .bundle-repo/README.md

      - name: Create circup zips
        run: |
          date_tag=$(python scripts/bundle_manager.py next-date-tag .bundle-repo)
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"

          python scripts/bundle_manager.py circup-zip .bundle-repo .circup-zips \
            --repo-name ChuMicro-Bundle --date-tag "$date_tag"

      - name: Push to bundle repository
        run: |
          python scripts/bundle_push.py \
            --bundle-dir .bundle-repo \
            --tag "${{ env.date_tag }}" \
            --commit-message "Update: ${{ needs.validate.outputs.library_name }} v${{ needs.validate.outputs.version }}"

      - name: Create bundle release
        run: |
          library_name="${{ needs.validate.outputs.library_name }}"
          version="${{ needs.validate.outputs.version }}"
          body=$(printf "## Updated libraries\n\n- **%s** v%s" "$library_name" "$version")

          gh release create "${{ env.date_tag }}" \
            --repo "ChuMicro/ChuMicro-Bundle" \
            --verify-tag \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

  # ---------------------------------------------------------------------------
  # Post-publish smoke test: validate mip install from the live stable
  # bundle repo.  The bundle job already validated locally before pushing;
  # this confirms the published artifacts are accessible via the github:
  # URL scheme that end users actually use.
  # ---------------------------------------------------------------------------
  validate-mip:
    name: Validate mip install (stable)
    needs: [validate, bundle]
    # Same library-only filter as the bundle job above.
    if: ${{ !inputs.dry_run && needs.validate.outputs.package_kind == 'library' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate mip install and import
        run: |
          python scripts/run.py validate-mip \
            --bundle-repo ChuMicro-Bundle \
            --libraries "${{ needs.validate.outputs.library_name }}"

  # ---------------------------------------------------------------------------
  # Deploy stable docs inline.
  #
  # Previously this job used fire-and-forget `gh workflow run` to trigger
  # docs-deploy.yml.  That workflow shares the `documentation-deploy`
  # concurrency group with push-triggered experimental deploys.  When a
  # new run enters the group while a stable deploy is pending, GitHub
  # Actions silently cancels the pending run — so the stable version
  # never reaches gh-pages.
  #
  # Inlining the deployment here makes it part of the promote workflow
  # and immune to that cancellation.  A retry loop handles transient
  # push conflicts with concurrent experimental deploys.
  # ---------------------------------------------------------------------------
  docs:
    name: Deploy stable docs
    needs: [validate, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            docs-pip-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy and push stable docs
        # docs_deploy_retry.py fetches gh-pages, runs run.py docs-deploy,
        # and pushes — retrying when a concurrent experimental deploy
        # forces a re-base.
        run: |
          python scripts/docs_deploy_retry.py \
            --channel stable \
            --libraries "${{ needs.validate.outputs.library_name }}"

  # ---------------------------------------------------------------------------
  # Publish the host-side libraries channel to the STABLE source repo
  # (B4, Decision 0078).  Mirrors release.yml's libraries-channel job but
  # targets ChuMicro/ChuMicro-Libraries via LIBRARIES_DEPLOY_KEY.  Gated to
  # library promotions — a workbench promotion changes no libraries/ tree,
  # so there is nothing to re-snapshot.
  #
  # Behavior note: the producer re-snapshots the WHOLE current libraries/
  # tree from main (the snapshot model wants one self-consistent set; it
  # has no per-library overlay mode).  So the stable channel is refreshed
  # to main's current source on each library promotion — that refresh
  # cadence is what makes it lag the experimental channel.  It is NOT a
  # per-library overlay of the frozen promoted source; see the
  # release-fabric-readiness workstream note.
  # ---------------------------------------------------------------------------
  libraries-channel:
    name: Publish libraries channel (stable)
    needs: [validate, release]
    if: ${{ !inputs.dry_run && needs.validate.outputs.package_kind == 'library' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure SSH for libraries channel repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.LIBRARIES_DEPLOY_KEY }}

      - name: Clone libraries channel repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Libraries.git" .libraries-repo

      - name: Stage and push libraries channel
        # A UTC timestamp is the snapshot tag — unique per run without a
        # next-date-tag call (that lives in bundle_manager, which pulls the
        # chumicro_deploy import chain this light job doesn't install).
        # libraries_channel wipes + rebuilds the clone's tree (except
        # .git/) from the current source, writes index.json for the tag,
        # then bundle_push commits + tags + pushes main.
        run: |
          snapshot_tag="$(date -u +%Y%m%d.%H%M%S)"
          python scripts/libraries_channel.py \
            --staging-dir .libraries-repo \
            --tag "$snapshot_tag" \
            --push
