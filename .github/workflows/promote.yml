name: Promote to stable

# Promotes an experimental release to stable.
#
# HOW TO USE: run this workflow from the "main" branch.  Enter the
# experimental tag to promote (e.g. chumicro-timing-v0.3.0-experimental) as input.
#
# The library source comes from the source archive attached to the
# experimental GitHub Release.  All scripts and build tooling come from
# main.  This guarantees CI improvements land in stable promotions
# without re-tagging.  See Decision 0023.

on:
  workflow_dispatch:
    inputs:
      experimental_tag:
        description: "Experimental tag to promote (e.g. chumicro-timing-v0.3.0-experimental)"
        type: string
        required: true
      dry_run:
        description: "Dry run — validate and build but do not publish or tag"
        type: boolean
        default: false

permissions:
  contents: write    # tags + GitHub Releases + push to gh-pages
  id-token: write    # PyPI trusted publishing (OIDC)

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Parse the tag, verify preconditions, confirm the source archive exists.
  # ---------------------------------------------------------------------------
  validate:
    name: Parse and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library_name: ${{ steps.parse.outputs.library_name }}
      version: ${{ steps.parse.outputs.version }}
      stable_tag: ${{ steps.parse.outputs.stable_tag }}
      library_dir: ${{ steps.parse.outputs.library_dir }}
      source_zip: ${{ steps.parse.outputs.source_zip }}
    steps:
      - name: Parse experimental tag
        id: parse
        env:
          TAG: ${{ inputs.experimental_tag }}
        run: |
          echo "Tag: ${TAG}"

          if [[ "$TAG" =~ ^chumicro-([a-z][a-z0-9_-]*)-v([0-9]+\.[0-9]+\.[0-9]+)-experimental$ ]]; then
            library_name="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            echo "library_name=${library_name}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "stable_tag=chumicro-${library_name}-v${version}" >> "$GITHUB_OUTPUT"
            echo "library_dir=libraries/${library_name}" >> "$GITHUB_OUTPUT"
            echo "source_zip=chumicro-${library_name}-v${version}-source.zip" >> "$GITHUB_OUTPUT"
            echo "✓ Promoting ${library_name} v${version} from experimental to stable"
          else
            echo "::error::Expected an experimental tag (e.g. chumicro-timing-v0.3.0-experimental), got '${TAG}'."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.experimental_tag }}"
          stable_tag="${{ steps.parse.outputs.stable_tag }}"
          source_zip="${{ steps.parse.outputs.source_zip }}"

          # 1. The experimental tag must exist.
          if ! git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Experimental tag ${tag} does not exist."
            exit 1
          fi

          # 2. The stable tag must not already exist.
          if git rev-parse "refs/tags/${stable_tag}" >/dev/null 2>&1; then
            echo "::error::Stable tag ${stable_tag} already exists."
            exit 1
          fi

          # 3. The experimental release must have a source archive.
          if ! gh release view "$tag" --json assets -q ".assets[].name" | grep -q "^${source_zip}$"; then
            echo "::error::Source archive ${source_zip} not found in release ${tag}.  Was the experimental release created before Decision 0023?"
            exit 1
          fi

          echo "✓ All preconditions met"

  # ---------------------------------------------------------------------------
  # Build and publish the stable package to PyPI.
  # ---------------------------------------------------------------------------
  release:
    name: "Release ${{ needs.validate.outputs.library_name }} v${{ needs.validate.outputs.version }} (stable)"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Download and unpack source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          library_name="${{ needs.validate.outputs.library_name }}"
          source_zip="${{ needs.validate.outputs.source_zip }}"
          tag="${{ inputs.experimental_tag }}"

          gh release download "$tag" \
            --pattern "$source_zip" \
            --dir /tmp/source-archive

          # Replace main's library source with the frozen experimental
          # source.  Only src/, pyproject.toml, VERSION, and README.md are
          # in the archive — that's everything the build needs.
          rm -rf "libraries/${library_name}/src"
          rm -f "libraries/${library_name}/pyproject.toml" \
                "libraries/${library_name}/VERSION" \
                "libraries/${library_name}/README.md"
          unzip -o "/tmp/source-archive/${source_zip}" \
            -d "libraries/${library_name}/"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distribution
        run: python -m build "${{ needs.validate.outputs.library_dir }}"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "${{ needs.validate.outputs.library_dir }}/dist/"
          attestations: true

      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.validate.outputs.stable_tag }}" \
            -m "Release ${{ needs.validate.outputs.library_name }} ${{ needs.validate.outputs.version }}"
          git push origin "${{ needs.validate.outputs.stable_tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.stable_tag }}
          name: ${{ needs.validate.outputs.stable_tag }}
          prerelease: false
          body: |
            Release of **chumicro-${{ needs.validate.outputs.library_name }}** version **${{ needs.validate.outputs.version }}**.
            Promoted from experimental tag `${{ inputs.experimental_tag }}`.
          # No file attachments — dist artifacts are already on PyPI and
          # CircuitPython/MicroPython users install from the bundle repo.
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to the stable bundle repository for mip and circup distribution.
  # ---------------------------------------------------------------------------
  bundle:
    name: Publish to ChuMicro/ChuMicro-Bundle
    needs: [validate, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Intentionally duplicates the download+unpack from the release job.
      # Each job runs on a separate runner, and artifact-passing would add
      # complexity for a lightweight download that only happens on promotion.
      - name: Download and unpack source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          library_name="${{ needs.validate.outputs.library_name }}"
          source_zip="${{ needs.validate.outputs.source_zip }}"
          tag="${{ inputs.experimental_tag }}"

          gh release download "$tag" \
            --pattern "$source_zip" \
            --dir /tmp/source-archive
          rm -rf "libraries/${library_name}/src"
          rm -f "libraries/${library_name}/pyproject.toml" \
                "libraries/${library_name}/VERSION" \
                "libraries/${library_name}/README.md"
          unzip -o "/tmp/source-archive/${source_zip}" \
            -d "libraries/${library_name}/"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      # Single unified cache for all .tools/ artifacts (mpy-cross + unix-port).
      # Using separate cache actions for the same path causes the second
      # restore to overwrite the first, leading to subtle corruption.
      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Build mpy-cross compilers
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-mpy-cross

      - name: Stage bundle artifacts
        run: |
          python scripts/bundle_manager.py stage \
            "${{ needs.validate.outputs.library_dir }}" \
            "${{ needs.validate.outputs.version }}" \
            .bundle-staging

      # ---------------------------------------------------------------
      # Pre-publish validation: verify mip install + import works from
      # the staged artifacts BEFORE pushing to the live bundle repo.
      # ---------------------------------------------------------------

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate staged bundle locally
        run: |
          python scripts/validate_mip_install.py \
            --staging-dir .bundle-staging \
            --libraries "${{ needs.validate.outputs.library_name }}"

      - name: Configure SSH for bundle repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BUNDLE_DEPLOY_KEY }}

      - name: Clone bundle repository
        run: git clone "git@github.com:ChuMicro/ChuMicro-Bundle.git" .bundle-repo

      - name: Copy staging into bundle repository
        run: |
          cp -r .bundle-staging/* .bundle-repo/
          cp LICENSE .bundle-repo/LICENSE

      - name: Generate bundle README
        run: |
          python scripts/bundle_manager.py readme \
            --bundle-dir .bundle-repo \
            -o .bundle-repo/README.md

      - name: Create circup zips
        run: |
          date_tag=$(python scripts/bundle_manager.py next-date-tag .bundle-repo)
          echo "date_tag=${date_tag}" >> "$GITHUB_ENV"

          python scripts/bundle_manager.py circup-zip .bundle-repo .circup-zips \
            --repo-name ChuMicro-Bundle --date-tag "$date_tag"

      - name: Push to bundle repository
        run: |
          cd .bundle-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          library_name="${{ needs.validate.outputs.library_name }}"
          version="${{ needs.validate.outputs.version }}"
          git commit -m "Update: ${library_name} v${version}"

          git tag "${{ env.date_tag }}"
          git push origin main "${{ env.date_tag }}"

      - name: Create bundle release
        run: |
          library_name="${{ needs.validate.outputs.library_name }}"
          version="${{ needs.validate.outputs.version }}"
          body=$(printf "## Updated libraries\n\n- **%s** v%s" "$library_name" "$version")

          gh release create "${{ env.date_tag }}" \
            --repo "ChuMicro/ChuMicro-Bundle" \
            --verify-tag \
            --title "Bundle ${{ env.date_tag }}" \
            --notes "$body" \
            .circup-zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_TOKEN }}

  # ---------------------------------------------------------------------------
  # Post-publish smoke test: validate mip install from the live stable
  # bundle repo.  The bundle job already validated locally before pushing;
  # this confirms the published artifacts are accessible via the github:
  # URL scheme that end users actually use.
  # ---------------------------------------------------------------------------
  validate-mip:
    name: Validate mip install (stable)
    needs: [validate, bundle]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        id: tools-cache
        with:
          path: .tools
          key: tools-${{ hashFiles('target-runtimes.toml', 'scripts/prepare_*.py', 'scripts/shared.py') }}

      - name: Install unix-port build dependencies
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config

      - name: Prepare MicroPython unix-port
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: python scripts/run.py prepare-micropython

      - name: Validate mip install and import
        run: |
          python scripts/validate_mip_install.py \
            --bundle-repo ChuMicro-Bundle \
            --libraries "${{ needs.validate.outputs.library_name }}"

  # ---------------------------------------------------------------------------
  # Deploy stable docs inline.
  #
  # Previously this job used fire-and-forget `gh workflow run` to trigger
  # docs-deploy.yml.  That workflow shares the `documentation-deploy`
  # concurrency group with push-triggered experimental deploys.  When a
  # new run enters the group while a stable deploy is pending, GitHub
  # Actions silently cancels the pending run — so the stable version
  # never reaches gh-pages.
  #
  # Inlining the deployment here makes it part of the promote workflow
  # and immune to that cancellation.  A retry loop handles transient
  # push conflicts with concurrent experimental deploys.
  # ---------------------------------------------------------------------------
  docs:
    name: Deploy stable docs
    needs: [validate, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            docs-pip-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy and push stable docs
        run: |
          library_name="${{ needs.validate.outputs.library_name }}"
          max_attempts=3

          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Attempt $attempt of $max_attempts"

            # Fetch the latest gh-pages so mike builds on top of the
            # current remote state (including any concurrent experimental
            # deploys that landed since the last attempt).
            git fetch origin gh-pages:gh-pages --force 2>/dev/null || true

            python scripts/run.py docs-deploy \
              --channel stable \
              --libraries "$library_name"

            if git push origin gh-pages; then
              echo "::endgroup::"
              echo "✓ Stable docs deployed for ${library_name}."
              exit 0
            fi

            echo "::endgroup::"
            echo "Push failed (likely concurrent update), retrying in 10s..."
            sleep 10
          done

          echo "::error::Failed to deploy stable docs after $max_attempts attempts."
          exit 1
