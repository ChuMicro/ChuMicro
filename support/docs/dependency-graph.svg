<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-strict" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6db5" />
    </marker>
    <marker id="arrow-di" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999" />
    </marker>
    <style>
      .node rect { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
      .node text { fill: #1f2937; font-weight: 500; }
      .node.standalone rect { fill: #f3f4f6; stroke: #9ca3af; stroke-dasharray: 3 2; }
      .node.standalone text { fill: #6b7280; }
      .edge-strict { stroke: #3b6db5; stroke-width: 1.5; fill: none; }
      .edge-di { stroke: #999; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .legend-label { fill: #1f2937; font-size: 12px; }
      .legend-title { fill: #1f2937; font-size: 13px; font-weight: 600; }
      .row-label { fill: #6b7280; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background panel — keeps the graph readable on both light and dark GitHub themes (the SVG is rendered as a flat image and doesn't inherit the page background). -->
  <rect x="0" y="0" width="1120" height="720" fill="#fafafa" />

  <!-- Row labels -->
  <text x="20" y="50" class="row-label">Services</text>
  <text x="20" y="290" class="row-label">Building blocks</text>
  <text x="20" y="530" class="row-label">Foundation</text>
  <text x="20" y="630" class="row-label">Standalone</text>

  <!-- Strict-dep arrows (pyproject.toml dependencies) -->
  <g>
  <line x1="805.0" y1="336" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="165.0" y1="336" x2="205.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="645.0" y1="96" x2="165.0" y2="300" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="645.0" y1="96" x2="905.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="645.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="1005.0" y1="336" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="365.0" y1="336" x2="205.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="825.0" y1="96" x2="165.0" y2="300" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="825.0" y1="96" x2="905.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="825.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="285.0" y1="96" x2="905.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="285.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="465.0" y1="96" x2="905.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="465.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="585.0" y1="336" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="1005.0" y1="96" x2="905.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="1005.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="105.0" y1="96" x2="165.0" y2="300" class="edge-strict" marker-end="url(#arrow-strict)" />
  <line x1="105.0" y1="96" x2="545.0" y2="540" class="edge-strict" marker-end="url(#arrow-strict)" />
  </g>

  <!-- DI / typical-wiring arrows (constructor injection) -->
  <g>
  <line x1="105.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="285.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="285.0" y1="96" x2="545.0" y2="540" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="465.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="645.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="825.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  <line x1="1005.0" y1="96" x2="585.0" y2="300" class="edge-di" marker-end="url(#arrow-di)" />
  </g>

