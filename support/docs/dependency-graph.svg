    <text x="105.0" y="663.0" text-anchor="middle">chumicro-compat</text>
  </g>
  </g>

  <!-- Legend -->
  <g transform="translate(740, 620)">
    <text class="legend-title" x="0" y="0">Legend</text>
    <line x1="0" y1="20" x2="40" y2="20" class="edge-strict" marker-end="url(#arrow-strict)" />
    <text x="50" y="24" class="legend-label">strict dependency (pyproject.toml)</text>
    <line x1="0" y1="44" x2="40" y2="44" class="edge-di" marker-end="url(#arrow-di)" />
