[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chumicro-test-harness"
version = "0.1.0"
description = "Minimal device-test runner for Chumicro libraries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Chumicro" },
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

