[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chumicro-test-harness"
dynamic = ["version"]
description = "Minimal cross-runtime test runner for ChuMicro libraries (workspace-internal)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ChuMicro" },
]

# Single source of version truth: the VERSION file the release matrix keys
# the tag on, read the same way every library reads it.  This package uses
# the workspace's hatchling backend like every other published package.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
only-include = ["src/", "VERSION", "README.md", "tests/"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumicro_test_harness"]
