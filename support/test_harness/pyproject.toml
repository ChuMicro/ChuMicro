[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chumicro-test-harness"
dynamic = ["version"]
description = "Minimal cross-runtime test runner for ChuMicro libraries (workspace-internal)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ChuMicro" },
]

[tool.setuptools]
package-dir = {"" = "src"}

# Single source of version truth: the VERSION file the release matrix keys
# the tag on (mirrors the hatch `[tool.hatch.version] path = "VERSION"` every
# library uses, expressed for this package's setuptools backend).
[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
