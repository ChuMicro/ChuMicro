# secrets.toml — workspace-wide credentials + device defaults for the
# ChuMicro mono-repo.
#
# Gitignored at the workspace root (the file this materialises into is
# `<repo>/secrets.toml`, not this template).  Materialised on first
# ``setup`` and never overwritten — edit your real values into the
# materialised copy; re-runs of setup will not clobber them.
#
# Both [wifi] and [mqtt.broker] are placeholders — the mqtt functional
# tests require ``mqtt.broker.host`` / ``mqtt.broker.port``, so a
# fresh clone with this file unedited will skip them at collection
# time (no silent fall-through to a third-party broker).

[wifi]
# Real-network functional tests in libraries/{wifi, requests,
# http_server, mqtt, sockets, websockets} connect to this AP.
# Replace these placeholders with your real network — the gitignored
# materialised copy is the right place for that.
ssid = "replace-with-your-ap-ssid"
password = "replace-with-your-ap-password"

[mqtt.broker]
# Required for any mqtt functional test or the
# libraries/mqtt/examples/circuitpython_telemetry.py example.  Point
# at a broker you control (a LAN-local Mosquitto, a private cloud
# broker, …).  The ChuMicro mqtt library refuses to silently dial
# a third-party broker on your behalf — set the host explicitly.
host = "replace-with-your-broker-host"
port = 1883
