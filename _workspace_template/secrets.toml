# secrets.toml — workspace-wide credentials + device defaults for the
# ChuMicro mono-repo.
#
# Gitignored at the workspace root (the file this materialises into is
# `<repo>/secrets.toml`, not this template).  Materialised on first
# ``setup`` and never overwritten — edit your real values into the
# materialised copy; re-runs of setup will not clobber them.
#
# Mono-repo-specific opinion: ship ``test.mosquitto.org`` as the
# default MQTT broker so a fresh-clone contributor can run mqtt
# functional tests against the public broker without standing up
# their own.

[wifi]
# Real-network functional tests in libraries/{wifi, requests,
# http_server, mqtt, sockets, websockets} connect to this AP.
# Replace these placeholders with your real network — the gitignored
# materialised copy is the right place for that.
ssid = "replace-with-your-ap-ssid"
password = "replace-with-your-ap-password"

[mqtt.broker]
# Public test broker — no auth, no TLS — useful for first-deploy
# acceptance.  Override per-test under
# libraries/mqtt/functional_tests/config.toml when targeting a
# private broker; add broker auth under [mqtt.broker.auth] here.
host = "test.mosquitto.org"
port = 1883
