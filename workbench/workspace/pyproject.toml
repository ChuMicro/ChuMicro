[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chumicro-workspace"
dynamic = ["version"]
description = "Host-side runtime for ChuMicro project workspaces: config merge, secrets resolution, deploy orchestration, command dispatch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ChuMicro" },
]
dependencies = [
    # The only chumicro-internal dep.  ``chumicro-deploy`` owns the
    # devices.yml schema + writer + the firmware URL surface; workspace
    # composes on top.  No imports from ``libraries/``; those are
    # device-side packages, workbench is for the laptop.
    "chumicro-deploy",
    # MessagePack writer for the runtime-config artifact deployed to
    # the device.  Standard host-side library; ``writer.py`` passes
    # ``use_single_float=True`` so float32 encoding matches what
    # CircuitPython's native ``msgpack`` module accepts.
    "msgpack>=1.0",
    # ruamel.yaml; comes transitively via chumicro-deploy for
    # devices.yml round-trip; workspace also uses it directly for
    # workspace.yml comment-preserving append + quality config
    # reads.  Single YAML library across the workbench (PyYAML
    # dropped when the deploy package switched to ruamel).
    "ruamel.yaml>=0.18",
    # tomlkit; comment-preserving TOML round-trip used by the
    # additive ``setup`` re-apply path: when the upstream starter
    # gains new keys, append them to the user's secrets.toml /
    # project_config.toml without clobbering edits or losing comments.
    # The stdlib ``tomllib`` reads but can't write TOML; tomlkit fills
    # the writer half.  Pure Python, ~80 KB, CPython-only; workbench
    # scope only, never reaches a device.
    "tomlkit>=0.13",
]
keywords = [
    "circuitpython", "micropython", "microcontroller", "embedded",
    "workspace", "config", "deploy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]

[project.scripts]
chumicro-workspace = "chumicro_workspace.cli:main"

[project.urls]
Homepage = "https://github.com/ChuMicro/ChuMicro"
Documentation = "https://chumicro.com/ChuMicro/workspace/stable/"
Source = "https://github.com/ChuMicro/ChuMicro/tree/main/workbench/workspace"
Issues = "https://github.com/ChuMicro/ChuMicro/issues"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
only-include = ["src/", "VERSION", "README.md"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumicro_workspace"]
