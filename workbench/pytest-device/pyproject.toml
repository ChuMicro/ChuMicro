[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chumicro-pytest-device"
dynamic = ["version"]
description = "Pytest plugin that runs library functional tests on connected CircuitPython and MicroPython boards."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ChuMicro" },
]
keywords = [
    "circuitpython", "micropython", "microcontroller", "embedded",
    "pytest", "plugin", "device", "hardware-testing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest>=8.0",
    "chumicro-deploy>=0.1.0",
    # Hosts the device-orchestration primitives the pytest plugin's
    # collection layer dispatches to: ``device_runner`` (bg-thread
    # bootstrap runner), ``markers`` (parser + thread-safe queue),
    # ``device_orchestration`` (transport build + bootstrap build +
    # library-source-dir walking).  These are not pytest-specific;
    # pytest-device is one of two consumers, the other being
    # ``chumicro_workspace.deploy_api`` itself.
    "chumicro-workspace",
    # Used to msgpack-encode the runtime-config dict registered via
    # ``set_runtime_config()`` before staging it at
    # ``/runtime_config.msgpack`` on the device.  ``use_single_float=True``
    # keeps the wire shape compatible with CircuitPython's native
    # ``msgpack`` decoder (no float64 support).
    "msgpack>=1.0",
    # The TLS-echo fixture (``fixtures/tls_echo.py``) generates a
    # self-signed cert with ``cryptography``.  Declared directly; it is
    # NOT a transitive dependency of any other declared package.
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/ChuMicro/ChuMicro"
Source = "https://github.com/ChuMicro/ChuMicro/tree/main/workbench/pytest-device"
Issues = "https://github.com/ChuMicro/ChuMicro/issues"

[project.entry-points.pytest11]
chumicro_pytest_device = "chumicro_pytest_device.plugin"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
only-include = ["src/", "VERSION", "README.md"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumicro_pytest_device"]
