# Workspace dependencies + dev tooling.  This file is tool-owned —
# `chumicro-workspace-template update` will overwrite it (the version
# pins are how update flows in newer chumicro-workspace-runtime
# releases).  If you need extra deps, add them to a sibling file or
# extend the dependency tree in your fork of the template.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-workspace"
version = "0.1.0"
description = "ChuMicro project workspace."
requires-python = ">=3.11"
dependencies = [
    # Pin the runtime here so `python run.py setup` can install it
    # editable into the workspace's venv.
    "chumicro-workspace-runtime",
]

[tool.hatch.build.targets.wheel]
packages = ["things"]
