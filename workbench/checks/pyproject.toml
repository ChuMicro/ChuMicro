[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chumicro-checks"
dynamic = ["version"]
description = "Lint rules (CHU0NN) for ChuMicro workspaces: naming, whitespace, prose, and drift gates that no-op where their targets are absent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ChuMicro" },
]
keywords = [
    "chumicro", "lint", "static-analysis", "monorepo", "workspace",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ChuMicro/ChuMicro"
Source = "https://github.com/ChuMicro/ChuMicro/tree/main/workbench/checks"
Issues = "https://github.com/ChuMicro/ChuMicro/issues"

[project.scripts]
chumicro-checks = "chumicro_checks.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
only-include = ["src/", "VERSION", "README.md"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumicro_checks"]
