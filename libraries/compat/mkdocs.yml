site_name: chumicro-compat
site_url: https://chumicro.github.io/ChuMicro/compat/
repo_url: https://github.com/ChuMicro/ChuMicro/tree/main/libraries/compat
repo_name: Source
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: deep orange
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  favicon: img/favicon.png

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default:
      - stable
      - experimental
  homepage: ../../

nav:
  - Home: index.md
  - Guide: guide.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
