d;" /><path d="M 165.6,-64.8 L 165.6,-50.4 L 156.6,-50.4 L 174.6,-50.4 M 159.3,-46.08 L 171.9,-46.08 M 163.8,-41.76 L 167.4,-41.76" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="0.0" y="-232.6" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="0.0" dy="13">3V3</tspan></text><text x="-12.599999999999998" y="-188.7" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-12.599999999999998" dy="13">internal pull-up</tspan><tspan x="-12.599999999999998" dy="13">(tens of kΩ)</tspan></text><text x="-25.200000000000003" y="-106.39999999999999" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="middle"><tspan x="-25.200000000000003" dy="11">inside the microcontroller</tspan></text><text x="73.8" y="-159.88" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="73.8" dy="13">GPIO</tspan></text><text x="187.2" y="-129.3" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="187.2" dy="13">SW1</tspan><tspan x="187.2" dy="13">momentary</tspan></text><text x="-115.19999999999999" y="-20.0" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-115.19999999999999" dy="11">Released: the pull-up holds the pin at 3V3, so the pin reads HIGH.</tspan></text><text x="-115.19999999999999" y="-1.2799999999999994" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-115.19999999999999" dy="11">Pressed: the switch ties the pin to 0 V, so the pin reads LOW.</tspan></text><text x="-115.19999999999999" y="17.44" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-115.19999999999999" dy="11">This is Button(pin, active_low=True), the default. Add no resistor.</tspan></text><text x="-115.19999999999999" y="36.160000000000004" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-115.19999999999999" dy="11">Bare contacts bounce: leave settle_ms at 20.</tspan></text></svg>