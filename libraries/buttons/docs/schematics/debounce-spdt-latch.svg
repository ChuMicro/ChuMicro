="200.16" y="-94.82000000000001" dominant-baseline="ideographic" fill="#7f8a96" font-size="9.5" font-family="Arial" text-anchor="start"><tspan x="200.16" dy="9.5">4</tspan></text><text x="200.16" y="-76.82000000000001" dominant-baseline="ideographic" fill="#7f8a96" font-size="9.5" font-family="Arial" text-anchor="start"><tspan x="200.16" dy="9.5">5</tspan></text><text x="262.44" y="-208.21999999999997" dominant-baseline="ideographic" fill="#7f8a96" font-size="9.5" font-family="Arial" text-anchor="end"><tspan x="262.44" dy="9.5">3</tspan></text><text x="262.44" y="-85.82000000000001" dominant-baseline="ideographic" fill="#7f8a96" font-size="9.5" font-family="Arial" text-anchor="end"><tspan x="262.44" dy="9.5">6</tspan></text><circle cx="68.4" cy="-126.72" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="54" cy="-154.08" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="82.8" cy="-154.08" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><text x="88.2" y="-108.39999999999999" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="88.2" dy="13">SW1  SPDT</tspan></text><text x="23.400000000000002" y="-169.4" dominant-baseline="ideographic" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="end"><tspan x="23.400000000000002" dy="11">pressed</tspan></text><text x="113.39999999999999" y="-169.4" dominant-baseline="ideographic" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="113.39999999999999" dy="11">rest</tspan></text><text x="117.0" y="-253.5" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="117.0" dy="13">R1</tspan><tspan x="117.0" dy="13">10 kΩ</tspan></text><text x="104.39999999999999" y="-297.40000000000003" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="104.39999999999999" dy="13">3V3</tspan></text><text x="19.8" y="-253.5" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="19.8" dy="13">R2</tspan><tspan x="19.8" dy="13">10 kΩ</tspan></text><text x="32.4" y="-297.40000000000003" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="32.4" dy="13">3V3</tspan></text><text x="392.4" y="-215.67999999999995" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="392.4" dy="13">GPIO</tspan></text><text x="270.0" y="-214.6" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="270.0" dy="13">Q</tspan></text><text x="270.0" y="-81.4" dominant-baseline="hanging" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="270.0" dy="13">Q̅</tspan></text><text x="-10.8" y="-21.8" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">The pole reaches one contact at a time, and while it is in the air both</tspan></text><text x="-10.8" y="-3.08" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">gate inputs sit high, so the latch holds the value it already had. The</tspan></text><text x="-10.8" y="15.640000000000004" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">bouncing never reaches the pin: settle_ms=0.</tspan></text><text x="-10.8" y="34.36" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">At rest the pole grounds the rest contact and Q is HIGH. Pressed, it</tspan></text><text x="-10.8" y="53.08" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">grounds the other one and Q goes LOW: Button(pin, active_low=True).</tspan></text><text x="-10.8" y="71.8" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">U1 is a 74HC00, two of its four gates, powered from the same 3V3 as the</tspan></text><text x="-10.8" y="90.52" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">board. Tie the unused inputs (pins 9, 10, 12, 13) to GND and put 100 nF</tspan></text><text x="-10.8" y="109.24" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">across pin 14 and pin 7.</tspan></text><text x="-10.8" y="127.96000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-10.8" dy="11">This is the one arrangement that needs a three-terminal switch.</tspan></text><circle cx="104.4" cy="-201.6" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="32.4" cy="-154.08" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="295.2" cy="-192.6" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="381.6" cy="-192.6" r="2.7" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /></svg>