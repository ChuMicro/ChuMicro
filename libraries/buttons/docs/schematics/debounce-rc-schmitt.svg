<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="554.48pt" width="514.976pt" viewBox="-94.6 -287.6 514.976 554.48" style="background-color:none;"><circle cx="0" cy="-132.48" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="0" cy="-105.12" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="207.72" cy="-172.8" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><path d="M 0.0,-244.79999999999998 L 0,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-259.2 L -6.75,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-259.2 L 6.75,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-244.79999999999998 L 0,-226.8 L 9,-223.8 L -9,-217.8 L 9,-211.8 L -9,-205.8 L 9,-199.8 L -9,-193.8 L 0,-190.8 L 0,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-172.79999999999998 L 0,-162 L 0,-151.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-151.20000000000002 L 0,-136.8 M 10.8,-132.48 L 10.8,-105.12 M 10.8,-118.8 L 18,-118.8 M 0,-100.8 L 0,-86.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-86.39999999999999 L 0,-77.4 L 0,-68.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-68.39999999999999 L 0,-54 L -9,-54 L 9,-54 M -6.3,-49.68 L 6.3,-49.68 M -1.8,-45.36 L 1.8,-45.36" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-172.79999999999998 L 25.2,-172.8 L 28.2,-181.8 L 34.2,-163.8 L 40.2,-181.8 L 46.2,-163.8 L 52.2,-181.8 L 58.2,-163.8 L 61.2,-172.8 L 86.4,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 86.39999999999999,-172.79999999999998 L 104.4,-172.8 L 122.4,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-172.79999999999998 L 122.4,-143.64 M 131.4,-143.64 L 113.4,-143.64 M 131.4,-137.16 L 113.4,-137.16 M 122.4,-137.16 L 122.4,-108" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-108.0 L 122.4,-88.2 L 122.4,-68.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-68.39999999999999 L 122.4,-54 L 113.4,-54 L 131.4,-54 M 116.1,-49.68 L 128.7,-49.68 M 120.6,-45.36 L 124.2,-45.36" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-172.79999999999998 L 151.2,-172.8 L 180,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 160.02,-172.79999999999998 L 180,-172.8 M 212.04,-172.8 L 232.02,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 180.0,-190.79999999999998 L 203.4,-172.8 L 180,-154.8 L 180,-190.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 182.52,-167.39999999999998 L 189,-167.4 L 189,-178.2 M 191.88,-178.2 L 185.4,-178.2 L 185.4,-167.4" style="stroke:#7f8a96;fill:none;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 212.04,-172.79999999999998 L 239.04,-172.8 L 266.04,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-252.0 L 363.24,-266.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-266.40000000000003 L 356.49,-266.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-266.40000000000003 L 369.99,-266.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-252.0 L 363.24,-230.04 M 372.24,-230.04 L 354.24,-230.04 M 372.24,-223.56 L 354.24,-223.56 M 363.24,-223.56 L 363.24,-201.6" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-201.6 L 363.24,-192.6 L 363.24,-183.6" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 363.24,-183.6 L 363.24,-169.2 L 354.24,-169.2 L 372.24,-169.2 M 356.94,-164.88 L 369.54,-164.88 M 361.44,-160.56 L 365.04,-160.56" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="0.0" y="-275.8" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="0.0" dy="13">3V3</tspan></text><text x="-12.599999999999998" y="-228.29999999999998" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-12.599999999999998" dy="13">R1</tspan><tspan x="-12.599999999999998" dy="13">10 kΩ</tspan></text><text x="-7.919999999999998" y="-131.8" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-7.919999999999998" dy="13">SW1</tspan></text><text x="43.199999999999996" y="-211.39999999999998" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="43.199999999999996" dy="13">R2</tspan><tspan x="43.199999999999996" dy="13">4.7 kΩ</tspan></text><text x="135.0" y="-159.9" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="135.0" dy="13">C1</tspan><tspan x="135.0" dy="13">2.2 µF</tspan></text><text x="189.0" y="-195.31999999999996" dominant-baseline="ideographic" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="189.0" dy="11">1</tspan></text><text x="211.31999999999996" y="-195.31999999999996" dominant-baseline="ideographic" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="end"><tspan x="211.31999999999996" dy="11">2</tspan></text><text x="219.23999999999995" y="-158.79999999999998" dominant-baseline="hanging" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="219.23999999999995" dy="13">U1  74HC14</tspan></text><text x="276.84" y="-195.87999999999997" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="276.84" dy="13">GPIO</tspan></text><text x="363.24" y="-283.0" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="363.24" dy="13">3V3</tspan></text><text x="375.84" y="-246.29999999999998" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="375.84" dy="13">C2</tspan><tspan x="375.84" dy="13">100 nF</tspan></text><text x="357.84" y="-245.0" dominant-baseline="central" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="end"><tspan x="357.84" dy="11">pin 14</tspan></text><text x="357.84" y="-203.60000000000002" dominant-baseline="central" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="end"><tspan x="357.84" dy="11">pin 7</tspan></text><text x="366.84" y="-155.2" dominant-baseline="hanging" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="366.84" dy="13">U1 supply</tspan></text><text x="-90.0" y="-21.8" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Press: C1 empties through R2 alone, τ = 4.7 kΩ × 2.2 µF = 10 ms.</tspan></text><text x="-90.0" y="-3.08" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Release: C1 refills through R1 and R2 in line, τ = 14.7 kΩ × 2.2 µF = 32 ms.</tspan></text><text x="-90.0" y="15.64" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Same lopsided pair: C1 refills through R1 and empties without it. R2 can be larger</tspan></text><text x="-90.0" y="34.36000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">here than on a bare pin, because a 74HC14 input has no pull-up to divide against</tspan></text><text x="-90.0" y="53.08000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">and the pressed node reaches a true 0 V. A larger R2 narrows the gap between the two</tspan></text><text x="-90.0" y="71.80000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">constants and gentles the contacts: 330 µA through R1 plus a 0.7 mA peak as C1 empties.</tspan></text><text x="-90.0" y="90.52000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">The 74HC14 switches at 1.8 V on the way up and 1.05 V on the way down. C1 needs</tspan></text><text x="-90.0" y="109.24000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">12 ms to fall to the lower point and 25 ms to climb to the upper one, so the contacts</tspan></text><text x="-90.0" y="127.96000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">have long stopped moving before either one is crossed, and a gap in the bouncing</tspan></text><text x="-90.0" y="146.67999999999995" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">would have to last 13 ms to undo a crossing. One press, one clean output edge:</tspan></text><text x="-90.0" y="165.39999999999998" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">this is the wiring that earns settle_ms=0.</tspan></text><text x="-90.0" y="184.12" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">The output is inverted: pressing SW1 pulls the RC node LOW, so the pin goes HIGH.</tspan></text><text x="-90.0" y="202.83999999999997" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Read it with Button(pin, active_low=False).</tspan></text><text x="-90.0" y="221.55999999999997" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Power U1 from the same 3V3 as the board. Tie its five unused inputs, pins 3, 5, 9,</tspan></text><text x="-90.0" y="240.27999999999997" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">11 and 13, to GND, and keep C2 across pins 14 and 7 close to the chip.</tspan></text><circle cx="0" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="122.4" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="266.04" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /></svg>