<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="360.8pt" width="319.3999999999999pt" viewBox="-87.39999999999999 -273.2 319.3999999999999 360.8" style="background-color:none;"><circle cx="0" cy="-217.08" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="0" cy="-189.72" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><path d="M 0.0,-237.6 L 0,-252" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-252.0 L -6.75,-252" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-252.0 L 6.75,-252" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-237.6 L 0,-221.4 M 10.8,-217.08 L 10.8,-189.72 M 10.8,-203.4 L 18,-203.4 M 0,-185.4 L 0,-169.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-169.20000000000002 L 0,-156.6 L 0,-144" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-144.0 L 0,-135 L 9,-132 L -9,-126 L 9,-120 L -9,-114 L 9,-108 L -9,-102 L 0,-99 L 0,-90" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-90.0 L 0,-81 L 0,-72" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-72.0 L 0,-57.6 L -9,-57.6 L 9,-57.6 M -6.3,-53.28 L 6.3,-53.28 M -1.8,-48.96 L 1.8,-48.96" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-144.0 L 64.8,-144 L 129.6,-144" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="0.0" y="-268.6" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="0.0" dy="13">3V3</tspan></text><text x="-7.919999999999998" y="-222.9" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-7.919999999999998" dy="13">SW1</tspan><tspan x="-7.919999999999998" dy="13">momentary</tspan></text><text x="-12.599999999999998" y="-143.0" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-12.599999999999998" dy="13">R1</tspan><tspan x="-12.599999999999998" dy="13">10 kΩ</tspan><tspan x="-12.599999999999998" dy="13">pull-down</tspan></text><text x="140.4" y="-167.07999999999998" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="140.4" dy="13">GPIO</tspan></text><text x="-82.8" y="-32.599999999999994" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">Released: R1 drains the pin to 0 V, so the pin reads LOW.</tspan></text><text x="-82.8" y="-13.879999999999999" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">Pressed: the switch puts 3V3 on the pin, so the pin reads HIGH.</tspan></text><text x="-82.8" y="4.840000000000002" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">This is Button(pin, active_low=False).</tspan></text><text x="-82.8" y="23.560000000000002" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">R1 is not optional. Without it the pin floats when the button is up</tspan></text><text x="-82.8" y="42.28" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">and reads whatever the last stray charge left behind.</tspan></text><text x="-82.8" y="61.0" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-82.8" dy="11">Holding the button draws 3.3 V / 10 kΩ = 330 µA.</tspan></text><circle cx="0" cy="-144" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="129.6" cy="-144" r="2.7" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /></svg>