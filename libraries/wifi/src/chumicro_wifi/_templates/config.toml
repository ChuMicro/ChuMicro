# chumicro-wifi configuration.
# See https://chumicro.github.io/ChuMicro/wifi/ for the full reference.

[wifi]
ssid = ""                              # required: AP SSID to associate with
password = ""                          # required: WPA passphrase

# Tip: keep the password out of git by setting it under
# ``defaults.wifi.password`` in your workspace's gitignored
# ``workspace.local.yml`` instead of inlining here.  The deploy-time
# deep-merge picks up the overlay automatically.

# hostname = "thing-1"                 # optional: hostname advertised on the AP
# connect_timeout_ms = 15000           # optional: max wait per single connect attempt
# reconnect_backoff_start_ms = 1000    # optional: initial delay between reconnect attempts
# reconnect_backoff_max_ms = 60000     # optional: cap on exponential reconnect backoff
# reconnect_max =                      # optional: cap on total reconnects (omit for unlimited)
# power_save = false                   # optional: leave radio power-save enabled
