[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chumicro-wifi"
dynamic = ["version"]
description = "Unified wifi supervisor across CircuitPython, MicroPython, and CPython — sole-supervisor model with reconnect, state machine, and per-runtime adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ChuMicro" },
]
dependencies = [
    "chumicro-config",
    "chumicro-timing",
]
keywords = [
    "circuitpython", "micropython", "microcontroller", "embedded",
    "esp32", "rp2040", "wifi", "wlan", "supervisor",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChuMicro/ChuMicro"
Documentation = "https://chumicro.github.io/ChuMicro/wifi/stable/"
Source = "https://github.com/ChuMicro/ChuMicro/tree/main/libraries/wifi"
Issues = "https://github.com/ChuMicro/ChuMicro/issues"
Bundle = "https://github.com/ChuMicro/ChuMicro-Bundle"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.sdist]
include = ["src/", "VERSION", "README.md"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumicro_wifi"]

# ---------------------------------------------------------------------
# Runtime-config manifest — declares which sections this library reads
# from the ``runtime_config.msgpack`` payload (Decision 0035) and what
# keys each section's ``from_dict`` factory expects.  ``chumicro-workspace``
# reads this at deploy time to validate a project's merged config
# before baking the msgpack — missing required keys surface as a
# precise ``ConfigManifestError`` instead of a cryptic on-device
# ``MissingConfigKey`` boot failure.
#
# Schema:
#
#   [tool.chumicro.config.sections.<name>]
#   required = ["<key>", ...]               # missing → deploy-time error
#   optional = ["<key>", ...]               # missing → factory uses default
#
# Section names are inferred from the table keys — one
# ``[tool.chumicro.config.sections.<name>]`` per section.  An empty
# table is valid and means "this library reads ``<name>`` but
# doesn't pin keys yet" (forward-compat).
#
# Source of truth pairs with ``WifiConfig.from_dict`` in
# ``src/chumicro_wifi/config.py`` — keep them in sync.

[tool.chumicro.config.sections.wifi]
required = ["ssid", "password"]
optional = [
    "hostname",
    "connect_timeout_ms",
    "reconnect_backoff_start_ms",
    "reconnect_backoff_max_ms",
    "reconnect_max",
    "power_save",
]
