<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="502.64pt" width="428.498pt" viewBox="-94.6 -280.4 428.498 502.64" style="background-color:none;"><circle cx="0" cy="-132.48" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="0" cy="-105.12" r="4.32" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><path d="M 0.0,-244.79999999999998 L 0,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-259.2 L -6.75,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-259.2 L 6.75,-259.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-244.79999999999998 L 0,-226.8 L 9,-223.8 L -9,-217.8 L 9,-211.8 L -9,-205.8 L 9,-199.8 L -9,-193.8 L 0,-190.8 L 0,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-172.79999999999998 L 0,-162 L 0,-151.2" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-151.20000000000002 L 0,-136.8 M 10.8,-132.48 L 10.8,-105.12 M 10.8,-118.8 L 18,-118.8 M 0,-100.8 L 0,-86.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-86.39999999999999 L 0,-77.4 L 0,-68.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-68.39999999999999 L 0,-54 L -9,-54 L 9,-54 M -6.3,-49.68 L 6.3,-49.68 M -1.8,-45.36 L 1.8,-45.36" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-172.79999999999998 L 25.2,-172.8 L 28.2,-181.8 L 34.2,-163.8 L 40.2,-181.8 L 46.2,-163.8 L 52.2,-181.8 L 58.2,-163.8 L 61.2,-172.8 L 86.4,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 86.39999999999999,-172.79999999999998 L 104.4,-172.8 L 122.4,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-172.79999999999998 L 122.4,-143.64 M 131.4,-143.64 L 113.4,-143.64 M 131.4,-137.16 L 113.4,-137.16 M 122.4,-137.16 L 122.4,-108" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-108.0 L 122.4,-88.2 L 122.4,-68.4" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-68.39999999999999 L 122.4,-54 L 113.4,-54 L 131.4,-54 M 116.1,-49.68 L 128.7,-49.68 M 120.6,-45.36 L 124.2,-45.36" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 122.39999999999999,-172.79999999999998 L 172.8,-172.8 L 223.2,-172.8" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="0.0" y="-275.8" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="0.0" dy="13">3V3</tspan></text><text x="-12.599999999999998" y="-228.29999999999998" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-12.599999999999998" dy="13">R1</tspan><tspan x="-12.599999999999998" dy="13">10 kΩ</tspan></text><text x="-7.919999999999998" y="-131.8" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="end"><tspan x="-7.919999999999998" dy="13">SW1</tspan></text><text x="43.199999999999996" y="-211.39999999999998" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="middle"><tspan x="43.199999999999996" dy="13">R2</tspan><tspan x="43.199999999999996" dy="13">2.2 kΩ</tspan></text><text x="135.0" y="-159.9" dominant-baseline="central" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="135.0" dy="13">C1</tspan><tspan x="135.0" dy="13">2.2 µF</tspan></text><text x="234.0" y="-195.87999999999997" dominant-baseline="ideographic" fill="#7f8a96" font-size="13" font-family="Arial" text-anchor="start"><tspan x="234.0" dy="13">GPIO</tspan></text><text x="-90.0" y="-29.0" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Press: C1 empties through R2 alone, τ = 2.2 kΩ × 2.2 µF = 4.8 ms.</tspan></text><text x="-90.0" y="-10.280000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Release: C1 refills through R1 and R2 in line, τ = 12.2 kΩ × 2.2 µF = 27 ms.</tspan></text><text x="-90.0" y="8.440000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">C1 refills through R1 and empties without it, so the release edge is always the</tspan></text><text x="-90.0" y="27.160000000000004" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">slower one, and R2 has to stay well under R1: the pin's own pull-up is still on,</tspan></text><text x="-90.0" y="45.88" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">as little as 13 kΩ, and R2 divides against it. At 2.2 kΩ the pressed pin sits</tspan></text><text x="-90.0" y="64.60000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">near 0.5 V, a solid low; at 10 kΩ it would sit near 1.4 V, which is not one.</tspan></text><text x="-90.0" y="83.32000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">Closed, the contacts carry 330 µA through R1 plus a 1.5 mA peak as C1 empties</tspan></text><text x="-90.0" y="102.04" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">through R2. Leave R2 out and nothing limits that peak, and the press edge that</tspan></text><text x="-90.0" y="120.75999999999999" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">reaches the pin is the raw one the contacts made.</tspan></text><text x="-90.0" y="139.48" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">What this buys: the bouncing never reaches the pin, and the press edge takes 6 ms to</tspan></text><text x="-90.0" y="158.20000000000002" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">reach a valid low instead of arriving as fast as the metal moves. What it does</tspan></text><text x="-90.0" y="176.92000000000002" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">not buy: one guaranteed edge, because a plain input has a single threshold and no</tspan></text><text x="-90.0" y="195.64000000000001" dominant-baseline="hanging" fill="#7f8a96" font-size="11" font-family="Arial" text-anchor="start"><tspan x="-90.0" dy="11">hysteresis you can count on. Turn settle_ms down to 5 here, not to 0.</tspan></text><circle cx="0" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="122.4" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:#7f8a96;stroke-width:1.7;stroke-dasharray:-;" /><circle cx="223.2" cy="-172.8" r="2.7" style="stroke:#7f8a96;fill:none;stroke-width:1.7;stroke-dasharray:-;" /></svg>