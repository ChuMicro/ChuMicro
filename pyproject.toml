# Root-level pytest config drives IDE Testing-panel discovery (VS Code
# Pylance/Python extension, PyCharm).  Per-library / per-workbench coverage
# gates still run through `python scripts/run.py test`, which iterates each
# package's own pyproject.toml.
#
# importlib import-mode is required because test_cli.py / test_recovery.py
# exist in both workbench/deploy/tests and workbench/repl/tests; classic
# prepend import-mode collides on the unqualified module name.  importlib
# mode keys collected files by their full path.
[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["support", "libraries", "workbench", "scripts/tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# TID252 (flake8-tidy-imports) enforces the AGENTS.md non-negotiable
# "absolute imports only in code that runs on devices."  Library modules
# under libraries/*/src/ and support/test_harness/src/ are exec()'d by
# CircuitPython RAM-mode without a __package__, so a leading `.` has
# nothing to resolve against and the deploy fails.  per-file-ignores
# below relax the rule for trees that are host-only (workbench/, scripts/)
# or run independently of a package context (tests, functional_tests,
# examples).
select = ["E", "F", "I", "B", "UP", "TID252"]
external = ["CHU001", "CHU002", "CHU003", "CHU004", "CHU005"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"workbench/**" = ["TID252"]
"scripts/**" = ["TID252"]
"**/tests/**" = ["TID252"]
"**/functional_tests/**" = ["TID252"]
"**/examples/**" = ["TID252"]
# libraries/screens/examples/sans20.py is font_to_py output, regenerable
# from the command in its header; the tool's index lambda trips E731 and
# E741.
"libraries/screens/examples/sans20.py" = ["E731", "E741"]
# .github/skills/ holds host-only eval and report drivers (CPython, run
# directly, never deployed). E501 is relaxed because the render_*.py report
# generators embed long HTML/CSS/prompt literals that reflowing would mangle
# without catching a real defect; TID252 because host scripts need no package.
".github/skills/**" = ["TID252", "E501"]


# ---------------------------------------------------------------------------
# CHU lint rules (chumicro-checks)
# ---------------------------------------------------------------------------
#
# CHU008 is the workspace-template isolation rule — it gates on the
# presence of a ``packages/`` directory at root, which the chumicro
# mono-repo doesn't have.  It would self-no-op silently here either
# way; listing it explicitly documents the intent.

[tool.chumicro-checks]
ignore = ["CHU008"]
