[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --ignore-glob=**/functional_tests/**"
testpaths = ["support", "libraries", "scripts/tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
external = ["CHU001"]
