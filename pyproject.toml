[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
    "support/runtime/tests",
    "support/test_harness/tests",
    "libraries/sample/tests",
]

[tool.coverage.run]
branch = true
source = [
    "support/runtime/src/chumicro_runtime",
    "support/test_harness/src/chumicro_test_harness",
    "libraries/sample/src/chumicro_sample",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "ci",
    "scripts",
    "support/runtime/src",
    "support/runtime/tests",
    "support/test_harness/src",
    "support/test_harness/tests",
    "libraries/sample/src",
    "libraries/sample/tests",
    "libraries/sample/device_tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

