# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - main

  path_filters:
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!.scratch/**"
    - "!**/.coverage*"
    - "!**/dist/**"
    - "!**/site/**"
    - "!.tools/**"

  path_instructions:
    - path: "libraries/**/src/**"
      instructions: |
        This is library code that runs on CircuitPython, MicroPython, and CPython
        microcontrollers. Review for:
        - Memory efficiency: pre-allocated buffers, memoryview for slicing, no
          dynamic string building in loops.
        - Use f-strings exclusively (not str.format or % formatting).
        - Use const() from micropython for numeric constants (prefix internal
          constants with underscore).
        - Cache frequently used attributes in local variables in hot paths.
        - No async/await — this project uses a tick-based scheduler.
        - No hardware interrupts (ISRs) — use polling instead.
        - All network operations must be non-blocking.
        - Constructor injection for testability (Decision 0010).
        - Public API should follow CPython naming conventions.
        - All functions and methods need docstrings.

    - path: "scripts/**"
      instructions: |
        Infrastructure code — runs exclusively on CPython. Use full standard
        library freely. Do NOT use const(), memoryview, pre-allocated buffers,
        or other embedded-runtime patterns. Keep it idiomatic and readable.
        Prefer f-strings for readability (standard Python convention).

    - path: "libraries/**/tests/**"
      instructions: |
        Unit tests using pytest. Review for:
        - Per-library test runs (Decision 0009) — no cross-library test imports.
        - 90% coverage threshold per library.
        - Constructor injection for testability (Decision 0010).
        - Use library-provided testing submodule fakes, not ad-hoc mocks.
        - Keep tests simple, avoid test-only abstractions.

    - path: "libraries/**/examples/**"
      instructions: |
        Runnable examples. Must be importable (no bare top-level code without
        __main__ guard). Hardware examples (circuitpython_*.py, micropython_*.py)
        are verified for chumicro_* imports only.

    - path: "plans/**"
      instructions: |
        Planning documents. Check for internal consistency, alignment with
        codebase state, and correct cross-references to decision records.

chat:
  auto_reply: true

