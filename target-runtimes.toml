# Pinned runtime versions for compatibility testing and IDE stubs.
#
# Change these when upgrading the CircuitPython or MicroPython targets.
# The shared module (scripts/shared.py) and setup task (scripts/run.py)
# read from this file — no other files need version updates.

[circuitpython]
version = "10.2.0"

[micropython]
version = "v1.27.0"

[heap]
# Free-heap ceilings for the unix-port test lanes, measured on the
# reference Pi Pico W bench boards 2026-07-03: MicroPython 201,360 B
# and CircuitPython 126,288 B free after boot.  The lanes spawn each
# worker with `-X heapsize=<budget>` so an import-time or test-time
# MemoryError that would brick a real board shows up in preflight
# instead of on first flash.  Budgets sit under the measured ceiling
# to leave runtime headroom for wifi buffers and app state.
micropython = "192K"
circuitpython = "120K"

# Per-library overrides — only with a measured justification in the
# commit that adds one.  A test FILE that legitimately needs more heap
# than the budget (big fixtures, wide tables) raises its library here;
# production code must still fit the defaults on a real board.
[heap.overrides]
# Measured 2026-07-03 (smallest green budget for the library's full
# unix-lane suite, statement-chunked).  Budgets above the physical
# Pico W free heap (MP 201K / CP 126K) are test-lane artifacts, not
# production claims: the unix lane runs UNSTRIPPED sources while
# real-board deploys strip docstrings/comments (Decision 0090), and
# every library's bare production import measures <= 44 KB at the
# default budget.  The 2026-07-03 slimming pass split the oversized
# suites and re-measured every entry; what remains is floor, not fat.
# CP budgets are whole-file (CircuitPython's production default is
# flash mode, which execs whole files; the CP unix build also FATALs
# on long chunk sequences — revisit at the next CP toolchain bump), so
# they carry the whole-file compile transient MP's chunked lane avoids.
# Override convention: measured suite minimum + one 16K step of
# margin (heap layout flickers non-monotonically across 16K
# boundaries — observed on mqtt 2026-07-03).  runner carries no
# override: post-split it fits both defaults exactly (CP min == the
# 120K default, zero margin — deliberate; growth should trip the
# gate).  Irreducible floors, measured 2026-07-03: mqtt/requests
# import chains alone need 192K/144K, and single tests legitimately
# hold big buffers (mqtt bounded-recv 16K+8K, requests 7-hop
# redirect chain) — those floors cannot be split away.
msgpack = { circuitpython = "136K" }
wifi = { circuitpython = "136K" }
sockets = { circuitpython = "160K" }
# runner's measured CP min was exactly the 120K default (zero margin,
# co-set by test_generator.py); it ran green at default for several
# preflights, then flickered into a 320-byte load OOM on 2026-07-04 —
# the non-monotonic boundary behavior above, not growth.  min+16K.
runner = { circuitpython = "136K" }
http_server = { micropython = "208K", circuitpython = "192K" }
# screens' test_gc9a01a.py holds a 57,600 B frame plus a strip buffer
# of up to 33,600 B per test, 91,200 B that must sit in one free
# region.  Measured 2026-09-05 with the dirty-window tests and the
# fuller framebuf stub: the chunked file's largest free block at 192K
# falls under the frame itself, 200K is the smallest green budget.
# min+16K.  The driver on a real Pico W leaves 126 KB free after the
# panel (workstreams/screens-capability-slices.md).
screens = { micropython = "216K" }
requests = { micropython = "224K", circuitpython = "224K" }
mqtt = { micropython = "240K", circuitpython = "240K" }
websockets = { micropython = "240K", circuitpython = "208K" }
