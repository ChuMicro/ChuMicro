# The guides site: chumicro.github.io/ChuMicro/guides/
#
# Its pages are the repository's docs/ tree, so they read the same on
# GitHub and on the site.  The config sits at the repository root
# because the site generator refuses a docs_dir outside the config's
# own directory, and it builds with Zensical, the same generator the
# per-library sites use.
site_name: ChuMicro guides
site_description: >-
  Answers and fixes for CircuitPython and MicroPython projects: why a board
  freezes on the network, why WiFi will not connect, what to do when a deploy
  is refused, and how to keep data across a reboot.
site_url: https://chumicro.github.io/ChuMicro/guides/
repo_url: https://github.com/ChuMicro/ChuMicro
repo_name: Source
docs_dir: docs
# Built output, gitignored.  The docs deploy publishes it under guides/.
site_dir: .guides-site

theme:
  name: material
  palette:
    scheme: slate
    primary: deep orange
    accent: amber
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra:
  homepage: ../

nav:
  - Guides: index.md
  - Questions: faq.md
  - Troubleshooting:
      - Start here: troubleshooting/README.md
      - Board not found: troubleshooting/board-not-found.md
      - WiFi will not connect: troubleshooting/wifi-wont-connect.md
      - TLS and HTTPS failures: troubleshooting/tls-https-failures.md
      - Out of memory: troubleshooting/out-of-memory.md
      - Deploy refused for an import: troubleshooting/deploy-refused-importerror.md
      - Deploys and file persistence: troubleshooting/deploys-and-file-persistence.md
      - Persisting data: troubleshooting/persisting-data.md
      - Firmware onto a new board: troubleshooting/firmware-onto-a-new-board.md
      - CIRCUITPY on macOS: troubleshooting/macos-circuitpy.md
      - Board quirks: troubleshooting/board-quirks.md
      - CircuitPython ringio: troubleshooting/circuitpython-ringio.md
  - Wiring WiFi credentials: wiring-wifi-credentials.md
  - Contributing:
      - Cheat sheet: contributing/cheat-sheet.md
      - Pull requests: contributing/pull-requests.md
      - Style guide: contributing/style-guide.md
      - Writing a new library: contributing/new-library.md
      - Standalone integration: contributing/standalone-integration.md
      - Slimming your deploy: contributing/slimming-your-deploy.md
      - Config files: contributing/config-files.md
      - Device testing: contributing/device-testing.md
      - Workbench tools: contributing/workbench.md
      - Releases and promotion: contributing/releases.md
      - Maintainers: contributing/maintainers.md
      - Working with agents: contributing/working-with-agents.md
      - Agent style guide: contributing/agent-style-guide.md
      - VS Code setup: contributing/development-vscode.md
      - PyCharm setup: contributing/development-pycharm.md
      - Other editors: contributing/development-other-editors.md
